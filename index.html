<!DOCTYPE html><!-- build 2026-08-29 v9 -->

<html lang="en" data-theme="light">
<head>
<script>try{var _t=localStorage.getItem('oc_theme');if(_t==='dark'||_t==='light'){document.documentElement.setAttribute('data-theme',_t);}}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OakCraft Sales CRM — Enquiry to Dispatch</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<meta name="theme-color" content="#0f1729">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OakCraft CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- Chart.js is bundled locally (lib/) so the app also works inside the Android APK / offline;
     the CDN copy is only a fallback. It is deferred so it never blocks HTML parsing. -->
<script defer src="lib/chart.umd.min.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';document.head.appendChild(s)"></script>
<!-- xlsx (~900KB) is no longer loaded on every page load. ensureXLSX() fetches it
     on demand, the first time you actually export or import an Excel file. -->
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7; --surface:#ffffff; --surface-2:#fcfcfb; --sidebar:#0f1729; --sidebar-2:#1a2540;
  --text:#0b0b0b; --text-2:#52514e; --muted:#898781; --grid:#e1e0d9; --border:rgba(11,11,11,.10);
  --brand:#2a78d6; --brand-2:#1c5cab;
  --s1:#2a78d6; --s2:#008300; --s3:#e87ba4; --s4:#eda100; --s5:#1baf7a; --s6:#eb6834; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300;
  --radius:14px; --shadow:0 1px 2px rgba(11,11,11,.04),0 4px 16px rgba(11,11,11,.05);
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#1f1f1e; --sidebar:#08080c; --sidebar-2:#14141c;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --border:rgba(255,255,255,.10);
  --brand:#3987e5; --brand-2:#256abf;
  --s1:#3987e5; --s2:#008300; --s3:#d55181; --s4:#c98500; --s5:#199e70; --s6:#d95926; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --good-ink:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--grid);border-radius:6px}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:var(--sidebar);color:#cdd5e6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2a78d6,#4a3aa7);display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;flex-shrink:0}
.brand h1{font-size:16px;color:#fff;font-weight:700;letter-spacing:-.2px}
.brand span{font-size:11px;color:#7b88a8;display:block;font-weight:500}
.nav{padding:8px 12px;flex:1;overflow-y:auto}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#5d6a8a;padding:14px 12px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#aeb8d0;font-weight:500;font-size:13.5px;margin-bottom:2px;transition:.12s;position:relative}
.nav a svg{width:18px;height:18px;flex-shrink:0;stroke-width:2}
.nav a:hover{background:var(--sidebar-2);color:#fff}
.nav a.active{background:linear-gradient(90deg,rgba(42,120,214,.22),rgba(42,120,214,.06));color:#fff}
.nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brand)}
.nav a .badge{margin-left:auto;background:var(--brand);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1baf7a,#008300);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.sidebar-foot .info{font-size:12.5px;color:#dfe4ee;font-weight:600}
.sidebar-foot .info small{display:block;color:#7b88a8;font-weight:500;font-size:11px}

/* Main */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:20}
.topbar .page-title{font-size:19px;font-weight:700;letter-spacing:-.3px}
.topbar .page-title small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.search{margin-left:auto;position:relative}
.search input{width:260px;padding:9px 12px 9px 36px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface-2)}
.icon-btn:hover{background:var(--bg)}
.content{padding:24px 26px 40px;overflow-y:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:.12s}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent}
.btn.primary:hover{background:var(--brand-2)}
.btn svg{width:16px;height:16px}
.btn.sm{padding:6px 11px;font-size:12.5px}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi .k-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.kpi .k-ico svg{width:19px;height:19px}
.kpi .val{font-size:26px;font-weight:750;letter-spacing:-.6px}
.kpi .lbl{font-size:12.5px;color:var(--text-2);font-weight:500;margin-top:2px}
.kpi .delta{font-size:12px;font-weight:700;margin-top:9px;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--good-ink)} .delta.down{color:var(--crit)}

/* Panels / grid */
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;justify-content:space-between}
.panel h3 small{font-size:12px;color:var(--muted);font-weight:500}
.panel .chart-wrap{position:relative;height:260px;margin-top:14px}
.panel .chart-sm{height:220px}

/* Funnel */
.funnel{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.funnel-row{display:flex;align-items:center;gap:12px}
.funnel-row .fl{width:96px;font-size:12.5px;color:var(--text-2);font-weight:600}
.funnel-bar{flex:1;height:34px;border-radius:8px;display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:700;font-size:13px;min-width:60px}
.funnel-row .pct{width:44px;text-align:right;font-size:12.5px;color:var(--muted);font-weight:600}

/* Table */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-head h3{font-size:16px;font-weight:700}
.card-head .tools{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.field{padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:11px 20px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:13px 20px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td .strong{font-weight:650}
td .sub{color:var(--muted);font-size:12px}
.tabular{font-variant-numeric:tabular-nums}

/* Badges */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-new{color:#256abf;background:rgba(42,120,214,.12)}
.c-prog{color:#b06a00;background:rgba(237,161,0,.14)}
.c-won,.c-good{color:var(--good-ink);background:rgba(12,163,12,.13)}
.c-lost,.c-bad{color:var(--crit);background:rgba(208,59,59,.12)}
.c-quo{color:#7a2fa8;background:rgba(74,58,167,.13)}
.c-ship{color:#0b7a92;background:rgba(27,175,122,.14)}
.c-neutral{color:var(--text-2);background:rgba(137,135,129,.16)}
.prio{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.p-high{color:var(--crit);background:rgba(208,59,59,.1)}
.p-med{color:#b06a00;background:rgba(237,161,0,.13)}
.p-low{color:var(--text-2);background:rgba(137,135,129,.14)}

.avatar-sm{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0}
.cell-user{display:flex;align-items:center;gap:10px}

.row-actions button{width:30px;height:30px;border-radius:8px;color:var(--muted);border:1px solid transparent}
.row-actions button:hover{background:var(--bg);color:var(--brand);border-color:var(--border)}
.row-actions svg{width:15px;height:15px}

.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;overflow-x:auto}
.stage-col{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:180px}
.stage-col h4{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:10px;color:var(--text-2)}
.stage-col h4 span{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0 8px;font-size:11px}
.lead-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:9px;box-shadow:var(--shadow)}
.lead-card .lc-name{font-weight:650;font-size:13px}
.lead-card .lc-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.lead-card .lc-val{font-weight:700;font-size:13px;margin-top:7px;color:var(--brand)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,8,12,.55);backdrop-filter:blur(3px);display:none;place-items:center;z-index:100;padding:20px}
.modal-bg.show{display:grid}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:17px;font-weight:700}
.modal-body{padding:20px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
/* Form Builder: keep the row actions (edit + delete) always visible */
.modal.fb-wide{max-width:920px}
.fb-table{width:100%;min-width:520px}
.fb-actions{white-space:nowrap;width:1%}
.fb-actions .row-actions{display:flex;gap:2px;justify-content:flex-end;flex-wrap:nowrap}
.fb-actions .row-actions button{flex:0 0 auto}
/* Edit = green, Delete = red. Selectors are scoped to `.row-actions button` so they
   outrank the generic grey `.row-actions button` colour rule above. */
.row-actions button.fb-edit{color:var(--good)}
.row-actions button.fb-edit:hover{background:rgba(12,163,12,.12);color:var(--good);border-color:rgba(12,163,12,.45)}
.row-actions button.fb-del{color:var(--crit)}
.row-actions button.fb-del:hover{background:rgba(208,59,59,.12);color:var(--crit);border-color:rgba(208,59,59,.45)}
.form-row{margin-bottom:14px}
.form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
.form-row input:focus,.form-row select:focus{outline:2px solid var(--brand);border-color:transparent}

.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);padding:13px 20px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(120px);transition:.3s;z-index:200}
.toast.show{transform:translateY(0)}

.section-title{font-size:14px;font-weight:700;margin:22px 0 12px;color:var(--text-2)}
.hidden{display:none!important}
.empty{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-3{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}}

/* ===== v9: mobile drawer navigation, pipeline drag & drop, bottom-sheet modals ===== */
.menu-btn{display:none;flex:none}
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(8,8,12,.5);z-index:150}
.nav-backdrop.show{display:block}
.pipeline{grid-template-columns:repeat(6,minmax(180px,1fr))}
.lead-card[draggable="true"]{cursor:grab}
.lead-card.dragging{opacity:.45}
.stage-col.drop-over{outline:2px dashed var(--brand);outline-offset:-2px;background:rgba(42,120,214,.06)}
.lead-card .lc-act{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.lead-card .lc-act button{font:inherit;font-size:11px;padding:3px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text-2);display:inline-flex;align-items:center;gap:3px}
.lead-card .lc-act button svg{width:13px;height:13px}
.lead-card .lc-act button:hover{background:var(--bg);color:var(--brand)}
.topbar .page-title{min-width:0}
@media(max-width:1100px){.pipeline{grid-template-columns:repeat(3,minmax(180px,1fr))}}
@media(max-width:760px){
  .menu-btn{display:grid}
  .sidebar{display:flex;position:fixed;top:0;bottom:0;left:0;width:264px;max-width:86vw;z-index:160;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  .sidebar.open{transform:translateX(0)}
  body.nav-open{overflow:hidden}
  .topbar{height:auto;min-height:58px;padding:8px 12px;gap:8px;flex-wrap:wrap}
  .topbar img{width:32px!important;height:32px!important;margin-right:0!important}
  .topbar .page-title{font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .page-title small{display:none}
  .search{margin-left:0;flex:1 1 100%;order:10}
  .search input{width:100%}
  .btn.primary#quickAdd{padding:8px 11px;font-size:12.5px}
  .content{padding:14px 12px 90px}
  .kpi-grid{grid-template-columns:1fr 1fr!important;gap:10px!important}
  .kpi{padding:14px}
  .kpi .val{font-size:22px}
  .grid-2,.grid-3{gap:12px}
  .panel{padding:14px}
  .card-head{padding:12px 14px}
  .card-head .tools{margin-left:0;width:100%}
  thead th,tbody td{padding:10px 12px}
  .pipeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .stage-col{min-width:230px;flex:0 0 230px}
  .modal-bg{padding:0;align-items:end}
  .modal{max-width:100%;max-height:96vh;border-radius:16px 16px 0 0}
  .modal.fb-wide{max-width:100%}
  .modal-head,.modal-body,.modal-foot{padding-left:16px;padding-right:16px}
  .modal-foot{flex-wrap:wrap}
  .modal-foot .btn{flex:1 1 auto;justify-content:center}
  .form-row.two{grid-template-columns:1fr}
  .toast{left:12px;right:12px;bottom:14px;text-align:center}
  .funnel-row .fl{width:76px;font-size:11.5px}
  #syncPill{bottom:auto!important;top:8px!important;right:8px!important;font-size:11px!important;padding:5px 9px!important}
}

.oi-suggest{position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(11,11,11,.12);max-height:220px;overflow:auto;margin-top:2px}
.oi-sug-item{padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--border)}
.oi-sug-item:last-child{border-bottom:none}
.oi-sug-item:hover{background:var(--surface-2)}
.oi-sug-empty{padding:8px 10px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img class="logo" src="icons/icon-48.png" alt="CRM" width="38" height="38" style="object-fit:cover;background:#0b0b0b">
      <div><h1>OakCraft CRM</h1><span>Sales Pipeline Suite</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">Overview</div>
      <a data-view="dashboard" data-icon="dash" class="active"><span>Dashboard</span></a>
      <div class="nav-label">Sales Pipeline</div>
      <a data-view="enquiries" data-icon="inbox"><span>Enquiries / Leads</span><span class="badge" id="nb-enq">0</span></a>
      <a data-view="pipeline" data-icon="flow"><span>Pipeline Board</span></a>
      <a data-view="metaLeads" data-icon="flow"><span>Meta Leads</span><span class="badge" id="nb-meta">0</span></a>
      <a data-view="quotations" data-icon="doc"><span>Quotations</span><span class="badge" id="nb-quo">0</span></a>
      <a data-view="orders" data-icon="cart"><span>Orders</span><span class="badge" id="nb-ord">0</span></a>
      <a data-view="dispatch" data-icon="truck"><span>Dispatch</span><span class="badge" id="nb-dis">0</span></a>
      <div class="nav-label">Masters</div>
      <a data-view="customers" data-icon="users"><span>Customers</span></a>
      <a data-view="products" data-icon="box"><span>Products</span></a>
      <div class="nav-label">System</div>
      <a data-view="admin" data-icon="gear"><span>Admin Panel</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar">AG</div>
      <div class="info">Ankush Goswami<small>Admin · OakCraft</small></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="Menu" aria-label="Open menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <img src="logo-sm.png" alt="OakCraft" width="40" height="40" decoding="async" fetchpriority="low" style="width:40px;height:40px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;margin-right:6px;flex:none;">
      <div class="page-title" id="pageTitle">Dashboard<small id="pageSub">Sales performance overview</small></div>
      <div class="search" id="searchBox"><input id="globalSearch" placeholder="Search customers, orders…"></div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme"></button>

<script>
/* ============================================================

/* ---------- storage helpers ---------- */
const store = {
  get(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return mem[k]??def; } },
  set(k, val){ try{ localStorage.setItem(k, JSON.stringify(val)); }catch(e){ mem[k]=val; } try{ CLOUD.push(k, val); }catch(e){} }
};
const mem = {};
/* ===== OakCraft Cloud Sync (Google Sheets backend) ===== */
const CLOUD = {
  url: "https://script.google.com/macros/s/AKfycbwYDLF2Mh8SCuMTLJTesuIunJ03tuAYFW7x2etsaKUJT3Dua29IsFzU-4E5eiDAX6o1/exec",
  // which localStorage keys map to Sheet collections
  keys: ['enquiries','quotations','orders','dispatch','customers','products','users'],
  ready: false,
  _timers: {},
  async pull(){
    try{
      const r = await fetch(this.url + '?action=getAll', {redirect:'follow'});
      const j = await r.json();
      const d = j.data || j || {};
      this.keys.forEach(k=>{
        if(Array.isArray(d[k])){
          // records stored as {id, data, updatedAt} -> unwrap .data
          let rows = d[k].map(x=> (x && x.data!==undefined) ? x.data : x);
            if(k==='users'){ const seen={}; rows = rows.filter(u=>{ const e=(u&&u.email?String(u.email).toLowerCase():''); if(!e) return true; if(seen[e]) return false; seen[e]=1; return true; }); }
          try{ localStorage.setItem(k, JSON.stringify(rows)); }catch(e){ mem[k]=rows; }
        }
      });
      // object-shaped configs
      ['formfields','permissions'].forEach(k=>{
        const arr = d[k];
        if(Array.isArray(arr)){
          const cfg = arr.find(x=>x && x.id==='__config__');
          if(cfg && cfg.data){ try{ localStorage.setItem(k, JSON.stringify(cfg.data)); }catch(e){ mem[k]=cfg.data; } }
        }
      });
      try{ localStorage.removeItem('oc_syncHash'); }catch(e){}
      this.ready = true;
      return true;
    }catch(e){ console.warn('CLOUD pull failed', e); return false; }
  },
  // push an entire collection to the sheet (debounced per-key)
  push(key, arr){
    if(!this.keys.includes(key)) return;
    clearTimeout(this._timers[key]);
    this._timers[key] = setTimeout(()=>{
      let _arr = arr||[];
        if(key==='users'){ const seen={}; _arr = _arr.filter(u=>{ const e=(u&&u.email?String(u.email).toLowerCase():''); if(!e) return true; if(seen[e]) return false; seen[e]=1; return true; }); }
        const _sid = (o)=>{ if(o&&o.id) return o.id; if(key==='users'&&o&&o.email) return 'USR-'+String(o.email).toLowerCase().replace(/[^a-z0-9]/g,'-'); return 'X'+Date.now()+Math.random().toString(36).slice(2,6); };
        const records = _arr.map(o=>({ id: _sid(o), data: o }));
      fetch(this.url, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'saveMany', collection:key, records})
      }).catch(e=>console.warn('CLOUD push failed', key, e));
    }, 400);
  },
  // push a single object-shaped collection (e.g. formfields/permissions) as one record
  pushObj(key, obj, tries){
    const self = this;
    const payload = JSON.stringify({action:'save', collection:key, record:{id:'__config__', data:obj}});
    const attempt = (n) => fetch(self.url, {method:'POST', redirect:'follow', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body: payload})
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r; })
      .catch(err => {
        console.warn('CLOUD pushObj failed', key, err);
        if(n > 0){ return new Promise(res => setTimeout(res, 1200)).then(() => attempt(n-1)); }
        throw err;
      });
    return attempt(typeof tries === 'number' ? tries : 2);
  }
};

    /* ---------- Order date + working-day helpers ----------

    const isoLocal = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const todayLocal = () => isoLocal(new Date());

    function addWorkDays(dateStr,n){
      if(!dateStr || !n) return '';
      const d = new Date(dateStr+'T00:00:00');
      if(isNaN(d.getTime())) return '';
      let added = 0;
      while(added < n){ d.setDate(d.getDate()+1); if(d.getDay() !== 0) added++; }
      return isoLocal(d);
    }
    function productTypeTAT(productType){
      if(PRODUCT_TYPE_TAT[productType]) return PRODUCT_TYPE_TAT[productType];
      const k = String(productType||'').toLowerCase().replace(/[^a-z]+/g,'');
      if(!k) return 0;

      if(k.indexOf('nonregular') >= 0) return 8;
      if(k.indexOf('regular') >= 0) return 3;

      const n = productTypeTAT(productType);
      return n ? addWorkDays(orderDate||todayLocal(),n) : '';

  const _now=new Date(), _cur=_now.getFullYear()+'-'+_now.getMonth(), _pd=new Date(_now.getFullYear(),_now.getMonth()-1,1), _prev=_pd.getFullYear()+'-'+_pd.getMonth();
  const _cnt=(list,key)=>list.filter(r=>_mk(r.date)===key).length;
  const _sum=(list,key)=>list.filter(r=>_mk(r.date)===key).reduce((a,o)=>a+(+o.amount||0),0);
  const mom=(cur,prev,pct)=>{ if(!prev&&!cur) return ['','up']; if(!prev) return ['new','up']; const d=cur-prev; if(!d) return ['0'+(pct?'%':''),'up']; return [(d>0?'+':'')+(pct?Math.round(d/prev*100)+'%':d),(d>0?'up':'down')]; };
  const dEnq=mom(_cnt(enq,_cur),_cnt(enq,_prev),true);
  const _convOf=key=>{ const l=enq.filter(r=>_mk(r.date)===key); return l.length?Math.round(l.filter(e=>e.stage==='Won').length/l.length*100):0; };
  const dConv=(function(){ const c=_convOf(_cur), p=_convOf(_prev); if(!_cnt(enq,_prev)) return ['','up']; const d=c-p; return [(d>0?'+':'')+d+' pts', d>=0?'up':'down']; })();
  const dOrd=mom(_cnt(ord.filter(o=>o.status!=='Cancelled'),_cur),_cnt(ord.filter(o=>o.status!=='Cancelled'),_prev),false);
  const dRev=mom(_sum(ord.filter(o=>o.status!=='Cancelled'),_cur),_sum(ord.filter(o=>o.status!=='Cancelled'),_prev),true);

  const kpi=(ico,iconBg,iconcol,val,lbl,delta,dir)=>`
    <div class="kpi">
      <div class="k-top"><div class="k-ico" style="background:${iconBg};color:${iconcol=iconcol}">${I[ico]}</div>
      ${delta?`<span class="delta ${dir}">${dir==='up'?I.up:I.down}${delta}</span>`:''}</div>
      <div class="val tabular">${val}</div><div class="lbl">${lbl}</div>
    </div>`;
  let iconcol;
  content.innerHTML=`
    <div class="kpi-grid">
      ${dcard('inbox','rgba(42,120,214,.12)','#2a78d6',totalEnq,'Total Enquiries',dEnq[0],dEnq[1])}
      ${dcard('flow','rgba(27,175,122,.14)','#1baf7a',conv+'%','Conversion Rate',dConv[0],dConv[1])}
      ${dcard('cart','rgba(237,161,0,.14)','#b06a00',openOrders,'Open Orders',dOrd[0],dOrd[1])}
      ${dcard('money','rgba(12,163,12,.13)','#0ca30c',short(revenue),'Revenue (excl. cancelled)',dRev[0],dRev[1])}
      ${dcard('truck','rgba(208,59,59,.12)','#d03b3b',pendingDis,'Pending Dispatch','','up')}
    </div>

    <div class="grid-2">
      <div class="panel"><h3>Revenue Trend <small>Last 6 months (₹ Lakh)</small></h3><div class="chart-wrap"><canvas id="ch-rev"></canvas></div></div>
      <div class="panel"><h3>Sales Funnel <small>Enquiry → Dispatch</small></h3><div id="funnel"></div></div>
    </div>

    <div class="grid-3">
      <div class="panel"><h3>Order Status</h3><div class="chart-wrap chart-sm"><canvas id="ch-status"></canvas></div></div>
      <div class="panel"><h3>Enquiry Sources</h3><div class="chart-wrap chart-sm"><canvas id="ch-src"></canvas></div></div>
      <div class="panel"><h3>Sales by Person <small>Won value</small></h3><div class="chart-wrap chart-sm"><canvas id="ch-sales"></canvas></div></div>
    </div>

    <div class="grid-2">
      <div class="panel"><h3>State-wise Sales <small>Won value %</small></h3><div class="chart-wrap chart-sm"><canvas id="ch-state"></canvas></div></div>
      <div class="panel"><h3>Salesperson-wise Sales <small>Won value</small></h3><div class="chart-wrap chart-sm"><canvas id="ch-salespie"></canvas></div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Recent Orders</h3><div class="tools"><button class="btn sm" onclick="setView('orders')">View all ${I.arrow}</button></div></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Amount</th><th>Payment</th><th>Status</th></tr></thead>
      <tbody>${ord.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,6).map(o=>`<tr style="cursor:pointer" onclick="openOrderDetail('${o.id}')">
        <td class="strong tabular">${o.id}</td>
        <td>${userCell(o.customer)}</td>
        <td>${o.product} <span class="sub">×${o.qty}</span></td>
        <td class="strong tabular">${money(Math.round((+o.amount||0)*1.18))} <span class="sub">incl. GST</span></td>
        <td>${payChip(o.payment)}</td>
        <td>${orderChip(o.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No orders yet.</td></tr>'}</tbody></table></div>
    </div>`;

  // charts (guarded — funnel is pure HTML so always renders)
  drawFunnel(enq,quo,ord,dis);
  if(typeof Chart!=='undefined'){ try{ drawRevenue(ord); drawStatus(ord); drawSources(enq); drawSalesBy(enq); drawStateSales(enq); drawSalesPie(enq); }catch(err){ console.warn('chart error',err); } }
  else { document.querySelectorAll('.chart-wrap').forEach(c=>{ if(!c.querySelector('.funnel')) c.innerHTML='<div class="empty" style="padding:30px">Charts load when online (Chart.js CDN)</div>'; }); }
}
function dcard(ico,bg,col,val,lbl,delta,dir){
  const dl = delta ? (delta==='new' ? `<span class="delta up" title="No data for last month">new</span>` : `<span class="delta ${dir}" title="vs last month">${dir==='up'?I.up:I.down}${delta}</span>`) : '';
  return `<div class="kpi"><div class="k-top"><div class="k-ico" style="background:${bg};color:${col}">${I[ico]}</div>
    ${dl}</div>
    <div class="val tabular">${val}</div><div class="lbl">${lbl}</div></div>`;
}

function chartFont(){ const dark=isDark(); return {color:dark?'#c3c2b7':'#52514e'}; }
function isDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
function gridColor(){ return isDark()?'#2c2c2a':'#e1e0d9'; }

function drawRevenue(ord){
  const ctx=document.getElementById('ch-rev'); if(!ctx)return;
  ord=ord||[];
  const now=new Date();
  const months=[], keys=[];
  for(let k=5;k>=0;k--){ const dt=new Date(now.getFullYear(), now.getMonth()-k, 1); months.push(dt.toLocaleString('en',{month:'short'})); keys.push(dt.getFullYear()+'-'+dt.getMonth()); }
  const sums={};
  ord.forEach(o=>{ const d=o.date?new Date(o.date):null; if(!d||isNaN(d))return; const key=d.getFullYear()+'-'+d.getMonth(); if(sums[key]===undefined)sums[key]=0; sums[key]+=(Number(o.amount)||0); });
  const data=keys.map(k=>+(( (sums[k]||0)/100000 ).toFixed(2)));
  const dataGst=data.map(v=>+((v*1.18).toFixed(2)));
  state.charts.rev=new Chart(ctx,{type:'line',data:{labels:months,datasets:[
    {label:'Order value (excl. GST)',data,borderColor:'#2a78d6',backgroundColor:ctx=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,240);g.addColorStop(0,'rgba(42,120,214,.25)');g.addColorStop(1,'rgba(42,120,214,0)');return g;},fill:true,tension:.35,borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#2a78d6',pointBorderColor:'#fff',pointBorderWidth:2},
    {label:'Billing (incl. 18% GST)',data:dataGst,borderColor:'#1baf7a',borderDash:[5,5],borderWidth:1.8,pointRadius:0,tension:.35,fill:false}
  ]},options:baseOpts({legend:true,yFmt:v=>'₹'+v+'L'})});
}
function drawFunnel(enq,quo,ord,dis){
  const el=document.getElementById('funnel'); if(!el)return;
  const stages=[
    ['Enquiries',enq.length,'#2a78d6'],
    ['Quotations',quo.length,'#4a3aa7'],
    ['Orders',ord.length,'#eda100'],
    ['Dispatched',dis.length,'#1baf7a'],
    ['Delivered',dis.filter(d=>d.status==='Delivered').length,'#008300'],
  ];
  const max=stages[0][1]||1;
  el.className='funnel';
  el.innerHTML=stages.map((s,i)=>{
    const w=Math.max(s[1]/max*100,8);
    const pct=i===0?'100%':Math.round(s[1]/max*100)+'%';
    return `<div class="funnel-row"><div class="fl">${s[0]}</div>
      <div class="funnel-bar" style="width:${w}%;background:${s[2]}">${s[1]}</div>
      <div class="pct">${pct}</div></div>`;
  }).join('');
}
function drawStatus(ord){
  const ctx=document.getElementById('ch-status'); if(!ctx)return;
  const order=['Confirmed','In Production','Ready','Dispatched','Delivered'];

  state.charts.status=new Chart(ctx,{type:'doughnut',data:{labels:order,datasets:[{data:counts,backgroundColor:cols,borderColor:isDark()?'#1a1a19':'#fff',borderWidth:2}]},
    options:{cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,padding:12,font:{size:12},color:chartFont().color}}},responsive:true,maintainAspectRatio:false}});
}
function drawSources(enq){
  const ctx=document.getElementById('ch-src'); if(!ctx)return;

  const labels=SOURCES.slice(); enq.forEach(e=>{ const s=String(e.source||'').trim(); if(s && labels.indexOf(s)<0) labels.push(s); });

function drawSalesBy(enq){

function _cityToState(city){
  if(!city) return 'Unknown';
  const m={ 'Delhi':'Delhi','New Delhi':'Delhi','Mumbai':'Maharashtra','Pune':'Maharashtra','Nagpur':'Maharashtra','Bangalore':'Karnataka','Bengaluru':'Karnataka','Mysore':'Karnataka','Chennai':'Tamil Nadu','Coimbatore':'Tamil Nadu','Hyderabad':'Telangana','Kolkata':'West Bengal','Ahmedabad':'Gujarat','Surat':'Gujarat','Vadodara':'Gujarat','Rajkot':'Gujarat','Jaipur':'Rajasthan','Jodhpur':'Rajasthan','Udaipur':'Rajasthan','Lucknow':'Uttar Pradesh','Kanpur':'Uttar Pradesh','Noida':'Uttar Pradesh','Ghaziabad':'Uttar Pradesh','Agra':'Uttar Pradesh','Gurgaon':'Haryana','Gurugram':'Haryana','Faridabad':'Haryana','Chandigarh':'Chandigarh','Bhopal':'Madhya Pradesh','Indore':'Madhya Pradesh','Patna':'Bihar','Kochi':'Kerala','Thiruvananthapuram':'Kerala','Bhubaneswar':'Odisha','Guwahati':'Assam','Ranchi':'Jharkhand','Raipur':'Chhattisgarh','Dehradun':'Uttarakhand','Amritsar':'Punjab','Ludhiana':'Punjab' };
  return m[city] || city;
}
function drawStateSales(enq){
  const ctx=document.getElementById('ch-state'); if(!ctx)return;
  const custs=DB.customers();
  const byState={};
  enq.filter(e=>e.stage==='Won').forEach(e=>{
    const c=custs.find(x=>x.id===e.custId);
    const st=_cityToState(c&&c.city);
    byState[st]=(byState[st]||0)+(e.value||0);
  });
  let labels=Object.keys(byState), data=labels.map(l=>byState[l]);
  if(state.charts.state) state.charts.state.destroy();
  if(!labels.length){ labels=['No data']; data=[1]; }
  const palette=['#1baf7a','#2a78d6','#eda100','#e87ba4','#8b5cf6','#eb6834','#4a3aa7','#e34948','#0ca30c','#00b8d4'];
  state.charts.state=new Chart(ctx,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:labels.map((l,i)=>palette[i%palette.length]),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12,padding:8}},tooltip:{callbacks:{label:function(c){const t=c.dataset.data.reduce((a,b)=>a+b,0)||1;const p=(c.parsed/t*100).toFixed(1);return ' '+c.label+': '+p+'%';}}}}}});
}
function drawSalesPie(enq){
  const ctx=document.getElementById('ch-salespie'); if(!ctx)return;
  const _SP=(getForm('enquiry').find(f=>f.label==='Salesperson')&&getForm('enquiry').find(f=>f.label==='Salesperson').options||SALES);
  const data=_SP.map(s=>enq.filter(e=>e.salesperson===s&&e.stage==='Won').reduce((a,e)=>a+(e.value||0),0));
  let labels=_SP.slice(); let d=data.slice();
  if(state.charts.salespie) state.charts.salespie.destroy();
  if(!d.some(v=>v>0)){ /* keep labels, show zeros as tiny slices */ }
  const palette=['#1baf7a','#2a78d6','#eda100','#e87ba4','#8b5cf6','#eb6834','#4a3aa7','#e34948'];
  state.charts.salespie=new Chart(ctx,{type:'pie',data:{labels:labels,datasets:[{data:d,backgroundColor:labels.map((l,i)=>palette[i%palette.length]),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12,padding:8}},tooltip:{callbacks:{label:function(c){const t=c.dataset.data.reduce((a,b)=>a+b,0)||1;const p=(c.parsed/t*100).toFixed(1);return ' '+c.label+': '+short(c.parsed)+' ('+p+'%)';}}}}}});
}


function baseOpts({legend=false,horizontal=false,yFmt=v=>v}={}){
  const gc=gridColor(), fc=chartFont().color;
  const catAxis={type:'category',grid:{display:false,drawBorder:false},border:{display:false},
    ticks:{color:fc,font:{size:11.5},autoSkip:false,callback:function(val){return this.getLabelForValue(val);}}};
  const valAxis={grid:{color:gc,drawBorder:false},border:{display:false},
    ticks:{color:fc,font:{size:11.5},callback:yFmt}};
  return {responsive:true,maintainAspectRatio:false,indexAxis:horizontal?'y':'x',
    plugins:{legend:legend?{position:'top',align:'end',labels:{boxWidth:12,usePointStyle:true,padding:14,font:{size:12},color:fc}}:{display:false},
      tooltip:{backgroundColor:isDark()?'#000':'#0b0b0b',padding:10,cornerRadius:8,titleFont:{size:12},bodyFont:{size:12.5}}},
    scales: horizontal ? {x:valAxis,y:catAxis} : {x:catAxis,y:valAxis}};
}

/* ---------- workflow actions ---------- */
const ORDER_FLOW=['Confirmed','In Production','Ready','Dispatched','Delivered'];
function nextStageBtn(o){
  const i=ORDER_FLOW.indexOf(o.status);
  if(o.status==='Delivered')return '<span class="chip c-won">Completed</span>';
  if(o.status==='Cancelled')return '<span class="chip c-lost">Cancelled</span>';
  return `<button class="btn sm" onclick="advanceOrder('${o.id}')">→ ${ORDER_FLOW[i+1]}</button>`;
}
function advanceOrder(id){
  const ord=DB.orders(); const o=ord.find(x=>x.id===id); if(!o)return;
  const i=ORDER_FLOW.indexOf(o.status); o.status=ORDER_FLOW[i+1];
  DB.save('orders',ord);
  if(o.status==='Dispatched'){ // auto-create dispatch record
    const dis=DB.dispatch();
    if(!dis.find(d=>d.orderId===o.id)){
      dis.push({id:uid('DSP-'),orderId:o.id,customer:o.customer,product:o.product,qty:o.qty,
        courier:'BlueDart',tracking:'TRK'+Math.floor(Math.random()*9000000+1000000),status:'Shipped',
        dispatchedOn:today(),eta:addDays(today(),5)});
      DB.save('dispatch',dis);
    }
    toast('Order dispatched — shipment created ✓');
  } else if(o.status==='Delivered'){
    const dis=DB.dispatch(); const d=dis.find(x=>x.orderId===o.id); if(d){d.status='Delivered';DB.save('dispatch',dis);}
    toast('Order delivered ✓');
  } else toast('Order moved to '+o.status);
  refreshBadges(); paintTable('ord-body');
}

function recalcExpectedDelivery(){
      const dEl=document.getElementById('o-date'), pEl=document.getElementById('o-ptype'),
            eEl=document.getElementById('o-exp'), hEl=document.getElementById('o-exp-hint');

         order that has no Product Type never wipes its saved delivery date. */

      if(hEl) hEl.textContent = n
        ? 'Auto-calculated: '+n+' working days after '+od+' (Mon to Sat are working days, Sunday excluded).'
        : 'Choose a Product Type - the expected delivery date is filled in automatically.';

function onOrderImage(i, input){

  const rd=new FileReader();
  rd.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const max=520; let w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const data=cv.toDataURL('image/jpeg',0.7);
      readOrderItems(); if(window.__orderItems[i]) window.__orderItems[i].image=data; window.__orderItems[i].imageName=(f&&f.name)||''; renderOrderItems();

async function saveUser(email){
  const name=v('u-name').trim(), mail=v('u-email').trim().toLowerCase(), pass=v('u-pass');
  if(!name||!mail){ toast('Name and login email are required'); return; }
  if(!email && pass.length<6){ toast('Password must be at least 6 characters'); return; }
  if(email && pass && pass.length<6){ toast('Password must be at least 6 characters'); return; }
  const users=DB_users();
  if(!email && users.find(x=>x.email===mail)){ toast('This email already exists'); return; }
  const rec={name, email:mail, phone:v('u-phone'), role:v('u-role'), status:v('u-status')};
  const setsPw = !!(pass && pass.length>=6);
  if(setsPw) rec.pwdSet=true;
  if(email){ Object.assign(users.find(x=>x.email===email), rec); }
  else { if(!setsPw) rec.pwdSet=false; users.push(rec); }
  store.set('users', users);
  /* FIX: pehle yahan pass sirf padha jaata tha, kahin save nahi hota tha. Isliye
     naya user server par bina password create hota tha aur login karne par usko
     "Invalid Credentials" milta tha. Ab password ka hash server par enrol karte
     hain (roster row pehle sheet me bhejte hain, warna server "no account" kahega). */
  if(setsPw){
    try{
      const h = await AUTH.hash(pass);
      await pushUsersNow(users);
      let en = await SRV.setPassword(mail, h);
      /* naya account: server anonymous setPassword allow karta hai (pehli baar) */
      if(!en || !en.ok) en = await ocAnonPost({ action:'setPassword', email:mail, hash:h });
      if(!en || !en.ok){
        toast('User saved, but password not set: ' + ((en && en.error) || 'server error'));
      }
    }catch(e){ toast('User saved, but the password could not be set.'); }
  }
  closeModal(); toast(email?'User updated ✓':'User login created ✓'); setView('admin');
}
/* users collection ko turant (bina debounce) sheet par bhejta hai */
/* Server ko bilkul anonymous POST. window.fetch shim har request me maujooda
   sid jod deta hai; activation ke liye hum ye nahi chahte, warna kisi doosre
   logged-in user ka token call ko elevate kar sakta hai. */
function ocAnonPost(payload){
  return new Promise(function(resolve){
    try{
      var x = new XMLHttpRequest();
      x.open('POST', CLOUD.url, true);
      x.onload = function(){ var j = null; try{ j = JSON.parse(x.responseText); }catch(err){} resolve(j || {}); };
      x.onerror = function(){ resolve({}); };
      x.send(JSON.stringify(payload || {}));
    }catch(err){ resolve({}); }
  });
}
function pushUsersNow(list){
  const records=(list||[]).map(o=>({ id:(o&&o.id)||('USR-'+String((o&&o.email)||'').toLowerCase().replace(/[^a-z0-9]/g,'-')), data:o }));
  return fetch(CLOUD.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'saveMany',collection:'users',records})}).catch(function(){});
}

/* ===== Custom (form-builder) question rendering for live forms ===== */
const CORE_FIELD_IDS = {enquiry:['f_cust','f_prod','f_qty','f_src','f_sales','f_prio','f_note'],order:['o_cust','o_prod','o_qty','o_date','o_ptype','o_exp','o_sales','o_pay','o_stat','o_img','o_note'],customer:['c_name','c_contact','c_city','c_email','c_phone','c_type'],product:['p_name','p_sku','p_cat','p_price','p_stock','p_unit']};
/* The Product Type question normally lives in the form builder as a custom field. It is the
   single source of truth for the auto-calculated Expected Delivery Date, and it is rendered
   only once - inside section 1 of the order form. */
function orderProductTypeField(){
  const fs = getForm('order') || [];
  return fs.filter(f=> f && f.id === 'o_ptype')[0]
      || fs.filter(f=> f && /product\s*type/i.test(f.label||''))[0]
      || null;
}
function orderProductTypeValue(o){
  const pf = orderProductTypeField();
  return (pf && o && o.custom) ? (o.custom[pf.id]||'') : '';
}
/* The Order Date question is also a form-builder field. Section 1 renders it read-only and
   always stamps it with the current date, so it must not be rendered a second time. */
function orderDateField(){
  const fs = getForm('order') || [];
  return fs.filter(f=> f && f.id === 'o_date')[0]
      || fs.filter(f=> f && /^\s*order\s*date\s*$/i.test(f.label||''))[0]
      || null;
}
function orderDateValue(o){
  const df = orderDateField();
  return (df && o && o.custom) ? (o.custom[df.id]||'') : '';
}
/* Which section of the order form each extra question belongs to. 'hidden' questions are
   the ones section 1 already owns; anything unmatched lands in the last section. */
const ORDER_FIELD_GROUPS = {
  hidden:    [/^\s*order\s*date\s*$/i, /product\s*type/i],
  payment:   [/amount/i, /payment\s*proof/i, /freight/i, /balance/i, /advance/i],
  logistics: [/transport/i, /courier/i, /invoice/i, /e-?way/i, /packing/i, /lr\s*no/i]
};
function orderFieldGroup(f){
  const l = String((f||{}).label||'');
  const hit = g => ORDER_FIELD_GROUPS[g].filter(rx=> rx.test(l)).length > 0;
  if(hit('hidden')) return 'hidden';
  if(hit('payment')) return 'payment';
  if(hit('logistics')) return 'logistics';
  return 'other';
}
function customFieldsFor(which){
  const core = CORE_FIELD_IDS[which] || [];
  let list = getForm(which).filter(f=> f && !f.locked && core.indexOf(f.id)===-1);
  if(which === 'order') list = list.filter(f=> orderFieldGroup(f) !== 'hidden');
  /* the customer form renders Billing / Shipping Address natively (see openCustModal) */
  if(which === 'customer') list = list.filter(f=> f.id!=='c_msg1tc8d' && f.id!=='c_msg1ttd9');
  return list;
}
function customFieldsHTML(which, rec, group){
  rec = rec || {};
  let cf = customFieldsFor(which);
  if(which === 'order') cf = cf.filter(f=> orderFieldGroup(f) === (group||'other'));
  if(!cf.length) return "";
  const cv = (rec.custom||{});
  return cf.map(function(f){
    const val = (cv[f.id]!=null)?cv[f.id]:"";
    const dom = "cf-"+which+"-"+f.id;
    const req = f.required?" required":"";
    let input="";
    if(which==="enquiry" && f.id==="c_mrwd1293"){
      const eid = (rec && rec.id) ? rec.id : "";
      return '<div class="form-row"><label>'+f.label+' <span style="color:var(--crit)">*</span></label><input id="'+dom+'" type="text" value="'+String(eid).replace(/"/g,"&quot;")+'" readonly style="background:var(--surface-2);cursor:not-allowed;color:var(--muted)" placeholder="(auto-generated on save)" title="Enquiry Id is auto-generated and locked"></div>';
    }
    if(f.type==="longtext"){ input = '<textarea id="'+dom+'" rows="2"'+req+'>'+String(val).replace(/</g,"&lt;")+'</textarea>'; }
    else if(f.type==="number"){ input = '<input id="'+dom+'" type="number" value="'+String(val).replace(/"/g,"&quot;")+'"'+req+'>'; }
    else if(f.type==="date"){ input = '<input id="'+dom+'" type="date" value="'+String(val).replace(/"/g,"&quot;")+'"'+req+'>'; }
    else if(f.type==="checkbox"){ input = '<label style="display:flex;align-items:center;gap:6px;font-weight:500"><input id="'+dom+'" type="checkbox" '+(val?"checked":"")+'> Yes</label>'; }
    else if(f.type==="dropdown"){ const opts=(f.options||[]).map(function(o){return '<option '+(String(val)===String(o)?"selected":"")+'>'+o+'</option>';}).join(""); input = '<select id="'+dom+'"'+req+'><option value="">-- Select --</option>'+opts+'</select>'; }
    else if(f.type==="file"){ input = '<input id="'+dom+'" type="file">'; }
    else { input = '<input id="'+dom+'" type="text" value="'+String(val).replace(/"/g,"&quot;")+'"'+req+'>'; }
    return '<div class="form-row"><label>'+f.label+(f.required?' <span style="color:var(--crit)">*</span>':"")+'</label>'+input+'</div>';
  }).join("");
}
function readCustomFields(which){
  const cf = customFieldsFor(which); const out={};
  cf.forEach(function(f){
    const el = document.getElementById("cf-"+which+"-"+f.id); if(!el) return;
    if(f.type==="checkbox") out[f.id]=el.checked;
    else if(f.type==="number") out[f.id]= el.value===""?"":Number(el.value);
    else out[f.id]=el.value;
  });
  return out;
}
function getForm(which){
  const all = store.get('formfields', null) || {};
  if(!all[which]){ all[which] = JSON.parse(JSON.stringify(DEFAULT_FORMS[which])); }
  return all[which];
}
async function saveForm(which, fields){
  const all = store.get('formfields', null) || {};
  all[which] = fields;
  // store.set pushes 'formfields' - but CLOUD.keys are arrays; store as wrapped
  store.set('formfields', all);
  // Live-sync the whole form definition to Google Sheets so edits AND deletes
  // are reflected in the sheet immediately (the __config__ record is replaced).
  try{
    await CLOUD.pushObj('formfields', all);
    return true;
  }catch(e){
    console.warn('formfields sheet sync failed', e);
    try{ toast('Saved on this device \u2014 Google Sheet sync failed. Check your connection.'); }catch(_){}
    return false;
  }
}
/* ===== Form Builder: reorder questions (arrows + drag & drop) ===== */
async function moveFormField(which, from, to){
  const fields = getForm(which);
  if(to<0 || to>=fields.length || from===to) return;
  const item = fields.splice(from,1)[0];
  fields.splice(to,0,item);
  openFormBuilder(which);
  await saveForm(which, fields);
}
let __fbDragFrom = null;
function fbDragStart(which, i, ev){ __fbDragFrom = i; try{ ev.dataTransfer.effectAllowed="move"; ev.dataTransfer.setData("text/plain", String(i)); }catch(e){} }
function fbDragOver(ev){ ev.preventDefault(); try{ ev.dataTransfer.dropEffect="move"; }catch(e){} if(ev.currentTarget) ev.currentTarget.style.outline="2px dashed var(--brand)"; }
function fbDragLeave(ev){ if(ev.currentTarget) ev.currentTarget.style.outline=""; }
function fbDrop(which, i, ev){ ev.preventDefault(); if(ev.currentTarget) ev.currentTarget.style.outline=""; let from=__fbDragFrom; if(from==null){ try{ from=+ev.dataTransfer.getData("text/plain"); }catch(e){} } __fbDragFrom=null; if(from==null||isNaN(from)) return; moveFormField(which, from, i); }
function openFormBuilder(which){
  const fields = getForm(which);
  const title = {enquiry:'Enquiry Form',order:'Order Form',customer:'Customer Form',product:'Product Form'}[which] || 'Form';
  const rows = fields.map((f,i)=>{
    const locked = f.locked ? ' <span class="chip c-neutral" style="font-size:10px">core</span>' : '';
    const tName = (FIELD_TYPES.find(x=>x.v===f.type)||{}).t || f.type;
    return '<tr data-i="'+i+'" draggable="true"'+' ondragstart="fbDragStart(\''+which+'\','+i+',event)"'+' ondragover="fbDragOver(event)" ondragleave="fbDragLeave(event)"'+' ondrop="fbDrop(\''+which+'\','+i+',event)">'+
      '<td style="cursor:grab;color:var(--muted);text-align:center" title="Drag to reorder">☰</td>'+
      '<td><b>'+f.label+'</b>'+locked+'</td>'+
      '<td class="sub">'+tName+(f.options?(' · '+f.options.length+' choices'):'')+'</td>'+
      '<td>'+(f.required?'Required':'Optional')+'</td>'+
      '<td class="fb-actions"><div class="row-actions">'+
        '<button onclick="moveFormField(\''+which+'\','+i+','+(i-1)+')" title="Move up"'+(i===0?' disabled style="opacity:.3"':'')+'>↑</button>'+
        '<button onclick="moveFormField(\''+which+'\','+i+','+(i+1)+')" title="Move down"'+(i===fields.length-1?' disabled style="opacity:.3"':'')+'>↓</button>'+
        '<button class="fb-edit" onclick="editFormField(\''+which+'\','+i+')" title="Edit question">'+I.edit+'</button>'+
        '<button class="fb-del" onclick="delFormField(\''+which+'\','+i+')" title="Delete question">'+I.trash+'</button>'+
      '</div></td></tr>';
  }).join('');
  openModal('<div class="modal-head"><h3>'+title+' Builder</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>'+
    '<div class="modal-body">'+
    '<p style="color:var(--text-2);font-size:13px;margin-bottom:10px">Add, edit or delete questions — every question now has both an Edit and a Delete button. Core fields are used by the pipeline, so deleting one asks for an extra confirmation. Use the up/down arrows or drag rows to reorder — the order applies to the live form and Excel export. Every change is pushed to the connected Google Sheet right away.</p>'+
    '<div style="overflow-x:auto"><table class="fb-table"><thead><tr><th style="width:28px"></th><th>Question</th><th>Answer Type</th><th></th><th style="text-align:right">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<button class="btn primary sm" style="margin-top:12px" onclick="editFormField(\''+which+'\',-1)">'+I.plus+'Add Question</button>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn primary" onclick="closeModal()">Done</button></div>');
  try{ modal.classList.add('fb-wide'); }catch(e){}
}
function editFormField(which, idx){
  const fields = getForm(which);
  const f = idx>=0 ? fields[idx] : {label:'',type:'text',required:false,options:[]};
  const typeOpts = FIELD_TYPES.map(x=>'<option value="'+x.v+'" '+(f.type===x.v?'selected':'')+'>'+x.t+'</option>').join('');
  openModal('<div class="modal-head"><h3>'+(idx>=0?'Edit':'Add')+' Question</h3><button class="icon-btn" onclick="openFormBuilder(\''+which+'\')">\u2715</button></div>'+
    '<div class="modal-body">'+
    '<div class="form-row"><label>Question / Field Name</label><input id="ff-label" value="'+(f.label||'')+'" placeholder="e.g. Preferred Delivery Date" '+(f.locked?'':'')+'></div>'+
    '<div class="form-row"><label>Answer Type</label><select id="ff-type" onchange="ffTypeChange()" '+(f.locked?'disabled':'')+'>'+typeOpts+'</select></div>'+
    '<div class="form-row" id="ff-opts-row" style="display:'+(f.type==='dropdown'?'block':'none')+'"><label>Dropdown Choices (one per line)</label><textarea id="ff-opts" rows="4" placeholder="Option 1\nOption 2">'+((f.options||[]).join('\n'))+'</textarea></div>'+
    '<div class="form-row"><label><input type="checkbox" id="ff-req" '+(f.required?'checked':'')+'> Required field</label></div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn" onclick="openFormBuilder(\''+which+'\')">Cancel</button><button class="btn primary" onclick="saveFormField(\''+which+'\','+idx+')">'+I.check+'Save Question</button></div>');
}
function ffTypeChange(){
  const t = document.getElementById('ff-type').value;
  document.getElementById('ff-opts-row').style.display = (t==='dropdown')?'block':'none';
}
async function saveFormField(which, idx){
  const fields = getForm(which);
  const label = (document.getElementById('ff-label').value||'').trim();
  if(!label){ toast('Question name is required'); return; }
  const type = document.getElementById('ff-type').value;
  const required = document.getElementById('ff-req').checked;
  let options = [];
  if(type==='dropdown'){ options = (document.getElementById('ff-opts').value||'').split('\n').map(s=>s.trim()).filter(Boolean); }
  if(idx>=0){
    const f = fields[idx];
    f.label=label; if(!f.locked){ f.type=type; } f.required=required; if(type==='dropdown') f.options=options; else delete f.options;
  } else {
    fields.push({id:'c_'+Date.now().toString(36), label, type, required, options: type==='dropdown'?options:undefined});
  }
  toast('Question saved \u2713');
  openFormBuilder(which);
  saveForm(which, fields);
}
async function delFormField(which, idx){
  const fields = getForm(which);
  const f = fields[idx];
  if(!f) return;
  const name = f.label || 'this question';
  const msg = f.locked
    ? 'Delete the core question "' + name + '"?\n\nThis field is used by the CRM pipeline, reports and the Excel export. Removing it will take it off the live form for everyone and it will no longer be collected.\n\nDelete it anyway?'
    : 'Delete the question "' + name + '"?\n\nIt will be removed from the live form and from the connected Google Sheet. Answers already saved in existing records are not changed.';
  if(!confirm(msg)) return;
  fields.splice(idx, 1);
  toast('Question deleted \u2713');
  openFormBuilder(which);
  saveForm(which, fields);
}

function xlsxReady(){ return typeof XLSX!=='undefined'; }
/* Loads the ~900KB Excel library the first time it is actually needed,
   instead of on every page load. */
let __xlsxPromise = null;
function ensureXLSX(){
  if(xlsxReady()) return Promise.resolve(true);
  if(!__xlsxPromise){
    __xlsxPromise = new Promise((resolve, reject)=>{
      const load = (src, next)=>{
        const s = document.createElement('script');
        s.src = src;
        s.onload = ()=>resolve(true);
        s.onerror = ()=>{ if(next) next(); else { __xlsxPromise = null; reject(new Error('xlsx load failed')); } };
        document.head.appendChild(s);
      };
      /* bundled copy first (works offline / inside the APK), CDN as fallback */
      load('lib/xlsx.full.min.js', ()=>load('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', null));
    });
  }
  return __xlsxPromise;
}
async function awaitXLSX(){
  if(xlsxReady()) return true;
  toast('Excel taiyaar ho rahi hai\u2026');
  try{ await ensureXLSX(); return true; }
  catch(e){ toast('Excel library load nahi hui \u2014 internet check kijiye'); return false; }
}
/* ===== Excel: append custom form-builder answers as extra columns ===== */
function appendCustomColumns(section, rows){
  const map = { enquiries:{form:"enquiry", src:DB.enquiries()}, orders:{form:"order", src:DB.orders()}, customers:{form:"customer", src:DB.customers()}, products:{form:"product", src:DB.products()} };
  const cfg = map[section]; if(!cfg) return rows;
  const fields = (typeof customFieldsFor==="function") ? customFieldsFor(cfg.form) : [];
  if(!fields.length) return rows;
  const byId = {}; cfg.src.forEach(function(o){ if(o&&o.id) byId[o.id]=o; });
  return rows.map(function(row, i){
    const idKey = Object.keys(row).find(function(k){ return /\bID\b/i.test(k) || k==="Product ID" || k==="Customer ID" || k==="Order ID" || k==="Enquiry ID"; });
    const rid = idKey ? row[idKey] : null;
    const rec = (rid && byId[rid]) ? byId[rid] : cfg.src[i];
    const cust = (rec && rec.custom) ? rec.custom : {};
    const extra = {};
    fields.forEach(function(f){ let v = cust[f.id]; if(f.type==="checkbox") v = v?"Yes":"No"; if(v==null) v=""; extra[f.label]=v; });
    return Object.assign({}, row, extra);
  });
}

  else if(section==='customers'){ const ord=DB.orders(); rows=DB.customers().map(c=>{const co=ord.filter(o=>o.custId===c.id);return {'Customer ID':c.id,Company:c.name,'Contact Person':c.contact,Email:c.email,Phone:c.phone,City:c.city,Type:c.type,Orders:co.length,'Lifetime Value':co.reduce((s,o)=>s+o.amount,0)};}); }
  else if(section==='products'){ rows=DB.products().map(p=>({'Product ID':p.id,Name:p.name,SKU:p.sku,Category:p.cat,'Unit Price':p.price,Stock:p.stock,Unit:p.unit,'Stock Value':p.price*p.stock})); }
  if(!rows.length){ toast('Nothing to export'); return; }

  // auto column widths
  const cols=Object.keys(rows[0]).map(k=>({wch:Math.min(Math.max(k.length,...rows.map(r=>String(r[k]??'').length))+2,40)}));
  ws['!cols']=cols;
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,name.charAt(0).toUpperCase()+name.slice(1));
  const stamp=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`OakCraft-${name}-${stamp}.xlsx`);
  toast('Downloaded '+rows.length+' rows ✓');
}

function waNumber(raw){
  var d = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
  if(!d) return '';
  d = d.replace(/^0+/, '');
  if(d.length === 10) d = '91' + d;          /* default country code: India */
  return (d.length >= 11 && d.length <= 15) ? d : (d.length ? d : '');
}
function orderWaText(o){
  var cust = DB.customers().find(function(c){ return c.id === o.custId; }) || {};
  var disp = DB.dispatch().find(function(d){ return d.orderId === o.id; });
  var unit = (DB.products().find(function(p){ return p.id === o.prodId; }) || {}).unit || 'pc';
  var L = [];
  L.push('Namaste ' + (cust.contact || o._cContact || o.customer || 'Sir/Madam') + ',');
  L.push('');
  L.push('OakCraft se aapke order ki update:');
  L.push('');
  L.push('Order ID: ' + o.id);
  L.push('Order Date: ' + (o.date || '-'));
  L.push('Product: ' + (o.product || '-') + ' x ' + (o.qty || 0) + ' ' + unit);
  L.push('Order Value: ' + money(o.amount));
  if(o.payment) L.push('Payment: ' + o.payment);
  L.push('Current Status: ' + (o.status || '-'));
  L.push('Expected Delivery: ' + (o.expDispatch || '-'));
  if(disp){
    L.push('');
    L.push('Dispatch Details:');
    L.push('Courier: ' + (disp.courier || '-'));
    L.push('Tracking No: ' + (disp.tracking || '-'));
    L.push('Dispatched On: ' + (disp.dispatchedOn || '-'));

    L.push('Delivery Status: ' + (disp.status || '-'));

  L.push('');

  L.push('Team OakCraft');
  return L.join('\n');
}
function waOrder(id, ev){

  find(email){ return this.users().find(u=>u&&(u.email||'').toLowerCase()===(email||'').toLowerCase()); },
  session(){ try{ const s=JSON.parse(localStorage.getItem(this.SESSION_KEY)||'null'); if(s&&s.exp&&Date.now()<s.exp) return s; }catch(e){} return null; },
  setSession(email){ try{ localStorage.setItem(this.SESSION_KEY, JSON.stringify({email, exp:Date.now()+this.SESSION_MS})); }catch(e){} },
  logout(){ try{ localStorage.removeItem(this.SESSION_KEY); }catch(e){} location.reload(); },
  current(){ const s=this.session(); return s? (this.find(s.email)||{email:s.email}) : null; },

async function doLogin(){
  const email=(document.getElementById('lg-email').value||'').trim().toLowerCase();
  const pw=document.getElementById('lg-pw').value||'';
  const msg=document.getElementById('loginMsg');
  if(!email||!pw){ if(msg)msg.textContent='Enter email and password.'; return; }
  const u=AUTH.find(email);
  if(!u){ if(msg)msg.textContent='No account for this email. Ask your admin to add you.'; return; }
  if(u.status && u.status!=='Active'){ if(msg)msg.textContent='This account is inactive.'; return; }
  const h=await AUTH.hash(pw); const list=AUTH.users(); const rec=list.find(x=>x&&(x.email||'').toLowerCase()===email);
  if(!u.pwdSet || !u.hash){ if(pw.length<6){ if(msg)msg.textContent='Choose a password of at least 6 characters.'; return; } rec.hash=h; rec.pwdSet=true; AUTH.saveUsers(list); AUTH.setSession(email); bootApp(); return; }
  if(u.hash!==h){ if(msg)msg.textContent='Incorrect password.'; return; }
  AUTH.setSession(email); bootApp();
}

const GST_STATES={'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','27':'Maharashtra','29':'Karnataka','30':'Goa','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','36':'Telangana','37':'Andhra Pradesh'};
function gstValid(g){ return /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/.test(g); }
function gstConfig(){ const c=(store.get('apiconfig',{})||{}); return c.gst||null; }
async function fetchByGST(prefix){
  var set = function(id,val){ var el=document.getElementById(prefix+'-'+id); if(el && val!=null && val!=='') el.value=val; };
  var msg = document.getElementById(prefix+'-gstmsg');
  var gEl = document.getElementById(prefix+'-gst'); var gstin = ((gEl&&gEl.value)||'').trim().toUpperCase(); if(gEl) gEl.value=gstin;
  if(!gstValid(gstin)){ if(msg){msg.style.color='#d03b3b';msg.textContent='Enter a valid 15-character GSTIN.';} return; }
  var st = GST_STATES[gstin.slice(0,2)]||''; var cfg = gstConfig();
  if(!cfg || !cfg.enabled || !cfg.fields || !cfg.fields[0]){
    if(st) set('city', st);
    var portalUrl = 'https://services.gst.gov.in/services/searchtp';
    var openPortal = function(){ try{ window.open(portalUrl, '_blank', 'noopener'); }catch(e){} };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(gstin).then(function(){
        if(msg){ msg.style.color='#0ca30c'; msg.textContent='GSTIN '+gstin+' copied. Opening GST portal in a new tab — paste (Ctrl+V), solve the captcha, then copy the details back here. State: '+(st||'unknown')+'.'; }
        openPortal();
      }).catch(function(){
        if(msg){ msg.style.color='#b06a00'; msg.textContent='Opening GST portal in a new tab. Enter GSTIN '+gstin+' there, solve the captcha, then copy the details back. State: '+(st||'unknown')+'.'; }
        openPortal();
      });
    } else {
      if(msg){ msg.style.color='#b06a00'; msg.textContent='Opening GST portal in a new tab. Enter GSTIN '+gstin+' there, solve the captcha, then copy the details back. State: '+(st||'unknown')+'.'; }
      openPortal();
    }
    return;
  }
  if(msg){ msg.style.color='var(--text-2)'; msg.textContent='Fetching from GST provider...'; }
  try{
    var endpoint = cfg.fields[1]||cfg.fields[0]; var url = endpoint.replace('{gstin}', gstin).replace('{GSTIN}', gstin);
    var headers = {}; if(cfg.fields[0]) headers['Authorization']=cfg.fields[0];
    var r = await fetch(url, {headers}); var j = await r.json(); var d = j.data||j.result||j.taxpayerInfo||j;
    var name = d.tradeNam||d.tradeName||d.lgnm||d.legalName||d.name||'';
    var addr = (d.pradr&&(d.pradr.adr||(d.pradr.addr&&d.pradr.addr)))||d.address||{};
    var city = (addr&&(addr.city||addr.dst||addr.loc))||st;
    if(name) set('name', name); if(city) set('city', city); if(d.email) set('email', d.email); if(d.mobile||d.phone) set('phone', d.mobile||d.phone);
    if(msg){ msg.style.color='#0ca30c'; msg.textContent='Details fetched. Review & save.'; }
  }catch(e){ if(msg){ msg.style.color='#d03b3b'; msg.textContent='Fetch failed: '+e.message+'. Check the GST endpoint in Admin > API Integrations.'; } }
}

/* ===== Fast start =====
   The old init() awaited CLOUD.pull() before painting anything, so the whole app sat on
   a blank screen for as long as the Apps Script round-trip took (measured ~4-6s).
   Now we paint straight from the localStorage cache and refresh from the Sheet in the
   background. Note seedUsers() must never run before a successful pull on a device with
   no cache, otherwise it would invent default users and push them over the real list. */
function hasLocalCache(){
  try{ const u = store.get('users', null); return !!(u && u.length); }catch(e){ return false; }
}
let __syncing = false;
function syncPill(on, failed){
  let el = document.getElementById('syncPill');
  if(!on){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement('div');
    el.id = 'syncPill';
    el.setAttribute('style','position:fixed;right:14px;bottom:14px;z-index:90;padding:7px 12px;border-radius:20px;'+
      'font:600 12px var(--sans);background:var(--surface);color:var(--text-2);border:1px solid var(--border);'+
      'box-shadow:0 4px 14px rgba(0,0,0,.12);opacity:.95;pointer-events:none');
    document.body.appendChild(el);
  }
  el.textContent = failed ? '\u26a0 Sheet sync failed' : 'Syncing with Google Sheet\u2026';
}
function refreshFromCloud(rerender){
  if(__syncing) return Promise.resolve(false);
  __syncing = true; syncPill(true);
  return CLOUD.pull().then(()=>{
    seedUsers();
    if(rerender && AUTH.session()){
      try{ applyUserToSidebar(); }catch(e){}
      try{ refreshBadges(); }catch(e){}
      // don't yank the page out from under an open modal
      const mb = document.getElementById('modalBg');
      const modalOpen = mb && mb.classList.contains('show');
      if(!modalOpen){ try{ setView((typeof state!=='undefined' && state.view) || 'dashboard'); }catch(e){} }
    }
    syncPill(false);
    return true;
  }).catch(e=>{
    console.warn('cloud pull error', e);
    syncPill(true, true); setTimeout(()=>syncPill(false), 4000);
    return false;
  }).finally(()=>{ __syncing = false; });
}
async function init(){
  injectIcons(); applyTheme(); seed();
  if(!AUTH.session()){ renderLogin(); return; }   // login screen needs no cloud data
  if(hasLocalCache()){
    seedUsers();
    bootApp();                 // instant paint from cache
    refreshFromCloud(true);    // fresh Sheet data arrives a moment later
  } else {
    await refreshFromCloud(false);  // first ever load on this device: wait once
    seedUsers();
    bootApp();
  }
}
function bindAppEvents(){
  if(window.__appBound) return; window.__appBound=true;
  document.querySelectorAll('.nav a[data-view]').forEach(a=>a.addEventListener('click',()=>setView(a.dataset.view)));

  });

    const map={enquiries:'enq-body',quotations:'quo-body',orders:'ord-body',dispatch:'dis-body',customers:'cust-body',products:'prod-body'};
    if(state.view==='enquiries')paintEnq(); else if(map[state.view])paintTable(map[state.view]);});

/* ============================================================================
   OakCraft Sales CRM  —  Phase 2 frontend
   ---------------------------------------------------------------------------
   1) Per-user data isolation : server-side session (sid) + fail-closed scope()
   2) Meta Leads pipeline     : Facebook / Instagram leads ka alag pipeline

   NOTE: ye block jaan-boojh kar init() se THEEK PEHLE rakha gaya hai, taaki
   saare override app start hone se pehle lag jaayein.
   ============================================================================ */
(function(){
  'use strict';

  var _lc = function(s){ return String(s == null ? '' : s).trim().toLowerCase(); };
  function meEmail(){ try{ var u = AUTH.current(); return u ? _lc(u.email) : ''; }catch(e){ return ''; } }
  function meIsAdmin(){ try{ return !!AUTH.isAdmin(); }catch(e){ return false; } }
  /* ---------------------------------------------------------------- *
   * ROLE VISIBILITY                                                  *
   * Sales Manager poori team ka data dekh sakta hai (orders etc.),   *
   * Sales Executive sirf apne owner wale records.                    *
   * Role pehle roster se, na mile to session token se padhte hain.   *
   * ---------------------------------------------------------------- */
  /* Kis role ko kis section ka POORA data (sabhi users ka) dikhega.
     'Sales Manager' -> sirf ORDERS section, admin ki tarah saare orders.
     Baaki sections (customers/enquiries/quotations/dispatch) me wo sirf
     apne records dekhta hai. Server par bhi yahi rule lagta hai. */
  var FULL_DATA_ROLES = { orders: ['sales manager'] };
  function meRole(){
    var r = '';
    try{ var u = AUTH.current(); r = _lc(u && u.role); }catch(e){}
    if(!r){ try{ var s = sidInfo(); r = _lc(s && s.role); }catch(e){} }
    return r;
  }
  function meSeesAll(coll){
    if(meIsAdmin()) return true;
    var allow = FULL_DATA_ROLES[String(coll || '').toLowerCase()];
    return !!(allow && allow.indexOf(meRole()) >= 0);
  }
  window.meRole = meRole;
  window.meSeesAll = meSeesAll;

  /* ------------------------------------------------------------------ *
   * 1. SERVER SESSION                                                   *
   * Login ab server par hota hai. Server ek sid (signed token) deta hai *
   * jise hum har request ke saath bhejte hain. Server usi ke hisaab se  *
   * sirf usi user ka data bhejta hai -> asli isolation.                 *
   * ------------------------------------------------------------------ */
  var SID_KEY = 'crm_sid';
  var SRV = {
    get: function(){ try{ return localStorage.getItem(SID_KEY) || ''; }catch(e){ return window.__sid || ''; } },
    set: function(v){ window.__sid = v || ''; try{ if(v) localStorage.setItem(SID_KEY, v); else localStorage.removeItem(SID_KEY); }catch(e){} },
    clear: function(){ SRV.set(''); },
    call: function(payload){
      return fetch(CLOUD.url, { method:'POST', body: JSON.stringify(payload || {}) })
        .then(function(r){ return r.json(); });
    },
    login: function(email, hash){ return SRV.call({ action:'login', email:email, hash:hash }); },
    setPassword: function(email, hash){ return SRV.call({ action:'setPassword', email:email, hash:hash }); }
  };
  window.SRV = SRV;

  /* ------------------------------------------------------------------ *
   * 2. FETCH SHIM                                                       *
   * sid ko sirf POST body me bhejte hain, URL me kabhi nahi (URL server *
   * logs / browser history / referrer me leak ho jaata hai).            *
   * Isliye purane GET ?action=... calls ko chupchaap POST bana dete hain.*
   * ------------------------------------------------------------------ */
  /* server jab bhi naya session token bheje (sliding window), use turant
     save kar lo -- isi se "one-time login" chalta hai. */
  function absorbRenewal(resp){
    try{
      resp.clone().text().then(function(txt){
        if(!txt || txt.indexOf('newSid') < 0) return;
        try{
          var o = JSON.parse(txt);
          if(o && typeof o.newSid === 'string' && o.newSid.indexOf('.') > 0){
            SRV.set(o.newSid);
            if(AUTH && typeof AUTH.touch === 'function') AUTH.touch();
          }
        }catch(e){}
      }).catch(function(){});
    }catch(e){}
    return resp;
  }

  var _fetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    try{
      var url = (typeof input === 'string') ? input : (input && input.url) || '';
      if(url.indexOf('/macros/s/') >= 0){
        var sid = SRV.get();
        var method = ((init && init.method) || (input && input.method) || 'GET').toUpperCase();

        if(method === 'GET'){
          var qi = url.indexOf('?');
          var base = qi >= 0 ? url.slice(0, qi) : url;
          var p = {};
          if(qi >= 0){
            url.slice(qi + 1).split('&').forEach(function(kv){
              if(!kv) return;
              var a = kv.split('=');
              p[decodeURIComponent(a[0])] = decodeURIComponent(String(a[1] || '').replace(/\+/g, ' '));
            });
          }
          if(sid) p.sid = sid;
          return _fetch(base, { method:'POST', body: JSON.stringify(p), redirect:'follow' }).then(absorbRenewal);
        }

        if(sid && init && typeof init.body === 'string'){
          try{
            var o = JSON.parse(init.body);
            if(o && typeof o === 'object' && !o.sid){
              o.sid = sid;
              var ni = {}; for(var k in init) ni[k] = init[k];
              ni.body = JSON.stringify(o);
              init = ni;
            }
          }catch(e){}
        }
      }
    }catch(e){}
    try{
      var _u2 = (typeof input === 'string') ? input : (input && input.url) || '';
      if(_u2.indexOf('/macros/s/') >= 0) return _fetch(input, init).then(absorbRenewal);
    }catch(e){}
    return _fetch(input, init);
  };

  /* ------------------------------------------------------------------ *

   * Ab: admin -> sab kuch, warna sirf apne owner wale records.           *
   * Session hi nahi mila to kuch bhi nahi (safe default).               *
   * ------------------------------------------------------------------ */
  window.scope = function(list, coll){
    if(!Array.isArray(list)) return [];
    if(meSeesAll(coll)) return list;   /* admin, ya elevated role (Sales Manager -> orders) */
    var m = meEmail();
    if(!m) return [];
    return list.filter(function(r){
      if(!r) return false;
      var o = _lc(r.owner || r.ownerEmail || r.createdBy);
      return o === m;
    });
  };

  window.canTouch = function(rec, coll){

  window.doLogin = async function(){
    var emEl = document.getElementById('lg-email');
    var pwEl = document.getElementById('lg-pw');
    var msg  = document.getElementById('loginMsg');
    var email = _lc(emEl ? emEl.value : '');
    var pw    = String(pwEl ? pwEl.value : '');

    function say(t, bad){
      if(!msg) return;
      msg.textContent = t;
      msg.style.color = bad ? '#c0392b' : '';
    }
    if(!email || !pw){ say('Email aur password dono zaroori hain.', true); return; }

    var h;
    try{ h = await AUTH.hash(pw); }
    catch(e){ say('Password process nahi ho paaya.', true); return; }

    say('Checking\u2026');
    try{
      var res = await SRV.login(email, h);

      /* Pehli baar login: user roster me hai par server par password set nahi
         hai -> password enrol karo, phir dobara login. */
      if(res && !res.ok && /invalid credentials/i.test(String(res.error || ''))){
        /* FIX -- naya user login nahi kar pa raha tha ("Invalid Credentials").

             Kaaran:
             1) Admin panel se user banane par password kahin save hi nahi hota tha
                (saveUser me pass padha jaata tha, use hota nahi tha), isliye account
                server par bina password banta tha.
             2) Pehli-baar activation ka fallback localStorage ke users cache par
                depend karta tha (AUTH.find). Naye device par login screen kisi bhi
                cloud pull se pehle render hota hai, to cache khaali -> activation
                skip -> server ka "invalid credentials" seedha screen par.

             Roster ko yahan check nahi kiya ja sakta: getAll ke liye valid session
             chahiye ("unauthorized"), aur login screen par session hota hi nahi.
             Anonymous sirf 2 actions allowed hain -- login aur setPassword. Aur
             server khud guard karta hai: jis account ka password pehle se set hai
             uske liye anonymous setPassword "login required" return karta hai.
             Isliye activation ka faisla server ke jawab se lete hain: */
          if(pw.length < 6){
            say('First time sign-in: choose a password of at least 6 characters.', true);
            return;
          }
          var en = await ocAnonPost({ action:'setPassword', email:email, hash:h });
          var enErr = _lc(en && en.error);
          if(en && en.ok){
            /* pehli baar: password activate ho gaya -> dobara login */
            try{
              var lu = AUTH.users();
              var lr = lu.find(function(x){ return x && _lc(x.email) === email; });
              if(lr){ lr.pwdSet = true; AUTH.saveUsers(lu); }
            }catch(err){}
            res = await SRV.login(email, h);
          } else if(/no account|not found|unknown user/.test(enErr)){
            SRV.clear();
            say('No account for this email. Ask your admin to add you.', true);
            return;
          } else if(/inactive|disabled|blocked/.test(enErr)){
            SRV.clear();
            say('This account is inactive. Please contact your admin.', true);
            return;
          } else {
            /* "login required" = account ka password pehle se set hai,
               matlab sirf password galat tha. */
            SRV.clear();
            say('Incorrect password. Please try again.', true);
            return;
          }
      }

      if(!res || !res.ok){
        SRV.clear();
        say(String((res && res.error) || 'Login fail hua.'), true);
        return;
      }

      SRV.set(res.sid || (res.data && res.data.sid) || '');
      say('Aapka data load ho raha hai\u2026');
      await CLOUD.pull();
      AUTH.setSession(email);
      bootApp();
    }catch(e){
      console.error('login failed', e);
      say('Server se baat nahi ho paayi \u2014 internet check kijiye.', true);
    }
  };
