  /* Purani (sid-less) session ko chalne nahi dena — warna user bina server
     session ke andar baitha rahega aur scoping bypass ho jaayegi. */
  /* ================================================================== *
   * 8. ONE-TIME LOGIN                                                   *
   * Pehle: local session 24 ghante me expire -> user ko roz login.       *
   * Ab   : server token 30 din valid hai aur har din chupchaap rotate    *
   *        ho jaata hai (sliding window). Jab tak banda app use karta    *
   *        rahega, dobara password nahi maangega.                        *
   * Sirf 3 cheezein logout karti hain:                                   *
   *   1) user khud Logout dabaye                                         *
   *   2) 30 din tak koi activity na ho (security expiry)                 *
   *   3) server kahe account inactive / token unauthorized hai           *
   * ================================================================== */

  AUTH.SESSION_MS = 30*24*60*60*1000;    // local session bhi 30 din

  /* token ke andar se email/role/expiry nikaalo. Signature server verify
     karta hai, ye sirf UI ke liye hai -- security iske bharose nahi hai. */
  function sidInfo(){
    try{
      var s = SRV.get();
      if(!s || s.indexOf('.') < 0) return null;
      var b = s.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
      var f = atob(b).split('|');
      if(f.length < 3) return null;
      var ex = Number(f[2]);
      if(!ex) return null;
      return { email: String(f[0]).toLowerCase(), role: f[1], exp: ex };
    }catch(e){ return null; }
  }

  /* activity par local session ki expiry aage badha do (throttled) */
  var _lastTouch = 0;
  AUTH.touch = function(){
    try{
      if(Date.now() - _lastTouch < 60000) return;
      var s = AUTH.session && AUTH.session();
      if(s && s.email){ AUTH.setSession(s.email); _lastTouch = Date.now(); }
    }catch(e){}
  };

  /* poora logout: token + cache + local session */
  function hardLogout(reload){
    try{ SRV.clear(); }catch(e){}
    try{ purgeCache(); }catch(e){}
    try{ localStorage.removeItem(AUTH.SESSION_KEY || 'crm_session'); }catch(e){}
    if(reload) location.reload();
  }

  /* ---- BOOT: token zinda hai to bina password seedha andar ---- */
  try{
    var _si = sidInfo();
    if(_si && Date.now() >= _si.exp){
      hardLogout(false);              // token expire -> saaf, login screen aayega
    } else if(_si && !(AUTH.session && AUTH.session())){
      AUTH.setSession(_si.email);     // token zinda, local session lapse -> restore
    }
  }catch(e){}

  /* ---- background verify ----
     Network fail par logout NAHI karte (offline me bhi app chalta rahe),
     sirf server ke saaf unauthorized/inactive par logout karte hain. */
  window.verifySession = function(){
    if(!SRV.get()) return;
    SRV.call({ action:'whoami' }).then(function(r){
      if(r && r.ok){
        if(r.newSid) SRV.set(r.newSid);

        return;
      }
      if(r && /unauthorized|inactive|invalid/i.test(String(r.error || ''))){
        hardLogout(true);

  setTimeout(function(){ try{ window.verifySession(); }catch(e){} }, 2000);

  /* ================================================================== *
   * 9. DELETE SYNC FIX                                                  *
   * Bug: 'saveMany' server par sirf UPSERT karta hai -- payload me jo    *
   * record nahi hai use delete nahi karta. Isliye app me record delete   *
   * karne par sheet ki row zinda reh jaati thi, aur next page load ke    *
   * pull par record wapas aa jaata tha (ghost record).                   *
   * Fix: local delete ke saath server ko explicit delete bhi bhejte hain.*
   * ================================================================== */

  CLOUD.remove = function(coll, id){
    if(!coll || !id) return Promise.resolve(false);
    return fetch(CLOUD.url, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      /* dono shapes bhejte hain: naya backend top-level id samajhta hai,
         purana sirf record.id -- isliye rollback par bhi kaam karega */
      body: JSON.stringify({ action: 'delete', collection: coll, id: String(id), record: { id: String(id) } })
    }).then(function(r){ return r.json(); })
      .then(function(j){ return !!(j && !j.error && (j.done === undefined || j.done > 0)); })
      .catch(function(){ return false; });
  };

  function countOf(key){
    try{ var a = store.get(key, []); return Array.isArray(a) ? a.length : 0; }catch(e){ return 0; }
  }

  /* delRow: purana function chalne do (confirm + local delete), uske baad
     agar record local se hat gaya hai to sheet se bhi hata do. */
  if(typeof delRow === 'function'){
    var _origDelRow = delRow;
    delRow = function(key, id){
      var before = countOf(key);
      var out = _origDelRow(key, id);
      if(countOf(key) < before){
        CLOUD.remove(key, id).then(function(ok){
          if(!ok) toast('Sheet se delete nahi ho paaya \u2014 internet check kijiye');
        });
      }
      return out;
    };
  }
  /* ---- UNIVERSAL DELETE PROPAGATION ---------------------------------
     Delete alag-alag jagah se hota hai: delRow, bulkDeleteProducts,
     deleteOrderAdmin, retired-id prune, waghera. Sheet ka saveMany sirf
     UPSERT karta hai, isliye array se nikla hua record sheet me zinda
     reh jaata tha aur agle pull par wapas aa jaata tha (ghost record).
     store.set ko wrap karke hum khud dekh lete hain ki kaun si id gayab
     hui, aur uske liye sheet par explicit delete bhej dete hain.
     Sirf local array ka pehle-baad comparison hota hai, isliye scoped
     (sirf apne records wale) user ke data par bhi ye safe hai. */
  (function(){
    if(window.__ocDelProp) return; window.__ocDelProp = true;

    /* ek hi id do baar delete na ho -- warna doosri call done:0 laut kar
       jhoothi "delete nahi ho paaya" warning dikha deti hai */
    var _rm = CLOUD.remove, _recent = {};
    CLOUD.remove = function(coll, id){
      var k = coll + "|" + id, now = Date.now();
      if(_recent[k] && (now - _recent[k]) < 20000) return Promise.resolve(true);
      _recent[k] = now;
      return _rm.call(CLOUD, coll, id);
    };

    var TRACK = ["enquiries","quotations","orders","dispatch","customers","products"];
    var _set = store.set.bind(store);
    store.set = function(k, val){
      var gone = [];
      try{
        if(TRACK.indexOf(k) >= 0 && Array.isArray(val)){
          var before = store.get(k, []) || [], now = {}, i, id;
          for(i = 0; i < val.length; i++){ if(val[i] && val[i].id) now[String(val[i].id)] = 1; }
          for(i = 0; i < before.length; i++){
            id = before[i] && before[i].id;
            if(id && !now[String(id)]) gone.push(String(id));
          }
        }
      }catch(e){}
      var out = _set(k, val);
      try{
        if(gone.length){
          console.log("[oc] sheet delete ->", k, gone.join(", "));
          gone.forEach(function(id){ CLOUD.remove(k, id); });
        }
      }catch(e){}
      return out;
    };
  })();

  /* delUser: users sheet me ek hi email ki duplicate rows ho sakti hain,
     isliye server se list lekar us email ki saari rows delete karte hain. */
  if(typeof delUser === 'function'){
    var _origDelUser = delUser;
    delUser = function(email){
      var before = countOf('users');
      var out = _origDelUser(email);
      if(countOf('users') < before){
        var want = String(email || '').trim().toLowerCase();
        SRV.call({ action:'list', collection:'users' }).then(function(j){
          var rows = (j && j.data) || [];
          var ids = [];
          rows.forEach(function(r){
            var d = (r && r.data) || {};
            if(String(d.email || '').trim().toLowerCase() === want && r.id) ids.push(r.id);
          });
          return Promise.all(ids.map(function(id){ return CLOUD.remove('users', id); }));

  /* ================================================================== *

  var META_STAGES_DEFAULT = ['New','Contacted','Qualified','Proposal','Won','Lost'];

  function lsGet(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }

  function isoDate(d){ d = d || new Date(); var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd; }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function nameOf(email){

  /* ---- CSV / TSV / JSON import (Meta Lead Ads export) ---- */
  function splitCsvLine(line, sep){
    var out = [], cur = '', q = false;
    for(var i = 0; i < line.length; i++){
      var ch = line[i];
      if(q){
        if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if(ch === '"'){ q = true; }
      else if(ch === sep){ out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(function(s){ return s.trim(); });
  }
  var ML_MAP = {
    name:      ['full_name','fullname','name','lead_name','full name'],
    phone:     ['phone_number','phone','mobile','contact','phone number','whatsapp'],
    email:     ['email','email_address','e-mail'],
    city:      ['city','town','location','district'],
    campaign:  ['campaign_name','campaign','ad_name','adset_name','campaign name'],
    adForm:    ['form_name','form','lead_form','form name'],
    product:   ['product','interested_in','requirement','product_interest','what_are_you_looking_for'],
    note:      ['note','notes','message','comments','remarks'],
    platform:  ['platform','source','channel']
  };
  function mlParse(text){
    text = String(text || '').trim();
    if(!text) return [];
    /* JSON? */
    if(text.charAt(0) === '[' || text.charAt(0) === '{'){
      try{
        var j = JSON.parse(text);
        var arr = Array.isArray(j) ? j : (Array.isArray(j.data) ? j.data : [j]);
        return arr.map(function(o){ return mlNormalise(o); }).filter(function(x){ return x; });
      }catch(e){ /* CSV try karo */ }
    }
    var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
    if(lines.length < 2) return [];
    var sep = (lines[0].indexOf('\t') >= 0) ? '\t' : ((lines[0].split(';').length > lines[0].split(',').length) ? ';' : ',');
    var head = splitCsvLine(lines[0], sep).map(function(h){ return _lc(h).replace(/\s+/g,'_'); });
    var out = [];
    for(var i = 1; i < lines.length; i++){
      var cells = splitCsvLine(lines[i], sep);
      var o = {};
      for(var c = 0; c < head.length; c++) o[head[c]] = cells[c];
      var n = mlNormalise(o);
      if(n) out.push(n);
    }
    return out;
  }
  function pick(o, keys){
    for(var i = 0; i < keys.length; i++){
      var k = keys[i];
      for(var kk in o){
        if(_lc(kk).replace(/\s+/g,'_') === k && String(o[kk] || '').trim()) return String(o[kk]).trim();
      }
    }
    return '';
  }
  function mlNormalise(o){
    if(!o || typeof o !== 'object') return null;
    var rec = {};
    for(var f in ML_MAP) rec[f] = pick(o, ML_MAP[f]);
    if(!rec.name && !rec.phone && !rec.email) return null;
    rec.id = mlId();
    rec.stage = 'New';
    rec.source = 'Meta';
    rec.platform = rec.platform || 'Facebook';
    rec.createdAt = isoDate();
    rec.owner = '';
    return rec;
  }

  /* ---- UI ---- */
  function mlStyle(){
    if(document.getElementById('mlStyle')) return;
    var s = document.createElement('style');
    s.id = 'mlStyle';
    s.textContent = '.ml-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}'

/* ================= Orders: Products table in the detail view + capped post-submission editing =================
   1. Every order detail drawer now shows a "Products" table listing each product row captured while
      the order form was filled in: image, name, order type, specification, qty, rate, line amount and
      any additional per-product field stored on the item.
   2. A submitted order can be reopened and edited, but only MAX_ORDER_EDITS (7) times in total.
      One successful save counts as one edit of the whole form; after the 7th save the order locks
      and neither the Edit button nor saveOrder() will touch it again.                              */
(function(){
  const MAX_ORDER_EDITS = 7;

  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const editsUsed = o => Math.min(MAX_ORDER_EDITS, Math.max(0, +((o||{}).editCount) || 0));
  const editsLeft = o => MAX_ORDER_EDITS - editsUsed(o);
  const isLocked  = o => editsLeft(o) <= 0;

  /* item keys that already have their own column */
  const BASE_KEYS = ['type','prodId','product','manual','spec','image','qty','rate','price','amount','custom'];
  const nice = k => k.replace(/[_-]+/g,' ').replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/^./, c => c.toUpperCase());

  const TH  = 'text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap';
  const TD  = 'padding:9px 10px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:top';
  const TDS = TD + ';min-width:170px;white-space:pre-wrap;color:var(--text-2)';
  const TDF = 'padding:10px;border-top:1px solid var(--border);background:var(--surface-2);font-size:12.5px;font-weight:700';

  /* orders saved before multi-product support only carry the flat product fields */
  function orderItems(o){
    o = o || {};
    if(o.items && o.items.length) return o.items;
    if(o.product) return [{ type:o.orderType||'', prodId:o.prodId||'', product:o.product, spec:'',
                            image:o.image||'', qty:o.qty||1,
                            rate:(+o.qty ? (+o.amount||0)/(+o.qty) : (+o.amount||0)) }];
    return [];
  }

  /* any extra per-product field the form captured, including per-item custom fields */
  function extraKeys(items){
    const out = [];
    items.forEach(it => {
      Object.keys(it||{}).forEach(k => {
        if(BASE_KEYS.indexOf(k) >= 0 || out.indexOf(k) >= 0) return;
        const val = it[k];
        if(val === '' || val == null || typeof val === 'object' || typeof val === 'boolean') return;
        out.push(k);
      });
      Object.keys((it||{}).custom || {}).forEach(k => {
        if(out.indexOf('custom:'+k) < 0 && it.custom[k] !== '' && it.custom[k] != null) out.push('custom:'+k);
      });
    });
    return out;
  }
  const extraVal = (it,k) => k.indexOf('custom:') === 0 ? (((it||{}).custom||{})[k.slice(7)] || '') : ((it||{})[k] || '');

  function productsTableHTML(o){
    const items = orderItems(o);
    if(!items.length) return '<div style="color:var(--muted);font-size:13px;padding:6px 0">No products were captured on this order.</div>';
    const prods  = DB.products();
    const extras = extraKeys(items);
    const rateOf = it => +((it.rate != null) ? it.rate : it.price) || 0;

    const rows = items.map((it,i) => {
      const p = prods.find(x => x.id === it.prodId) || {};
      const qty = +it.qty || 0, rate = rateOf(it);
      const img = it.image
        ? '<img src="'+esc(it.image)+'" alt="'+esc(it.product)+'" style="width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block">'
        : '<div style="width:54px;height:54px;border-radius:8px;border:1px dashed var(--border);display:grid;place-items:center;color:var(--muted);font-size:9px;line-height:1.2;text-align:center">No<br>image</div>';
      return '<tr>'
        + '<td class="tabular" style="'+TD+'">'+(i+1)+'</td>'
        + '<td style="'+TD+'">'+img+'</td>'
        + '<td style="'+TD+'"><div style="font-weight:650">'+esc(it.product||'—')+'</div>'
          + (p.name && p.name !== it.product ? '<div style="color:var(--muted);font-size:11px">'+esc(p.name)+'</div>' : '')
          + (it.manual ? '<div style="color:var(--muted);font-size:11px">manually entered</div>' : '')
        + '</td>'
        + '<td style="'+TD+'">'+(it.type ? '<span class="chip c-neutral" style="font-size:10.5px">'+esc(it.type)+'</span>' : '—')+'</td>'
        + '<td style="'+TDS+'">'+(it.spec ? esc(it.spec) : '—')+'</td>'
        + '<td class="tabular" style="'+TD+'">'+qty+(p.unit ? ' '+esc(p.unit) : '')+'</td>'
        + '<td class="tabular" style="'+TD+'">'+(rate ? money(rate) : '—')+'</td>'
        + '<td class="tabular" style="'+TD+';font-weight:650">'+(rate ? money(rate*qty) : '—')+'</td>'
        + extras.map(k => '<td style="'+TD+'">'+(esc(extraVal(it,k)) || '—')+'</td>').join('')
        + '</tr>';
    }).join('');

    const totQty = items.reduce((s,it) => s + (+it.qty||0), 0);
    const totAmt = items.reduce((s,it) => s + ((+it.qty||0) * rateOf(it)), 0);

    return '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-top:6px">'
      + '<table style="width:100%;border-collapse:collapse">'
      + '<thead><tr>'
        + ['#','Image','Product','Order Type','Specification','Qty','Rate','Amount']
            .concat(extras.map(k => nice(k.replace('custom:',''))))
            .map(h => '<th style="'+TH+'">'+esc(h)+'</th>').join('')
      + '</tr></thead>'
      + '<tbody>'+rows+'</tbody>'
      + '<tfoot><tr>'
        + '<td colspan="5" style="'+TDF+'">Total — '+items.length+' product'+(items.length>1?'s':'')+'</td>'
        + '<td class="tabular" style="'+TDF+'">'+totQty+'</td>'
        + '<td style="'+TDF+'"></td>'

      + '</tr></tfoot>'
      + '</table></div>';
  }

  /* ---- Orders: Edit (green) / Delete (red) button styles ------------------
     Delete Order ka access sirf Administrator ko hai -- galti se bhara hua
     order hi hataana hota hai, isliye confirm me poori detail dikhati hai

  var ORDER_EDIT_STYLE = 'color:var(--good);border-color:rgba(12,163,12,.45);background:rgba(12,163,12,.08)';
  var ORDER_DEL_STYLE  = 'color:var(--crit);border-color:rgba(208,59,59,.45);background:rgba(208,59,59,.08)';

  function isAdminNow(){
    try{ if(typeof AUTH !== 'undefined' && typeof AUTH.isAdmin === 'function') return !!AUTH.isAdmin(); }catch(e){}
    try{ var _r = String((window.meRole && window.meRole()) || '').toLowerCase(); return _r === 'administrator' || _r === 'owner'; }catch(e){}

  window.deleteOrderAdmin = function(id){

            + 'Order ID: ' + o.id + '\n'
            + 'Customer: ' + (o.customer || '-') + '\n'
            + 'Product : ' + (o.product || '-') + '\n'
            + 'Value   : ' + money(o.amount) + '\n'
            + 'Status  : ' + (o.status || '-') + '\n\n'
            + (disp ? 'Note: is order ki Dispatch entry (' + disp.id + ') apne aap nahi hategi -- use Dispatch section se alag delete kijiye.\n\n' : '')
            + 'Ye action undo nahi ho sakta.';
    if(!confirm(msg)) return;
    DB.save('orders', DB.orders().filter(function(x){ return x.id !== o.id; }));
    try{ refreshBadges(); }catch(e){}
    closeModal();
    toast('Order ' + o.id + ' deleted');
    try{ setView('orders'); }catch(e){}
    /* sheet se bhi hata do (CLOUD.remove delete-sync fix se aata hai) */
    try{
      if(typeof CLOUD !== 'undefined' && typeof CLOUD.remove === 'function'){
        CLOUD.remove('orders', o.id).then(function(ok){
          if(!ok) toast('Sheet se delete nahi ho paaya \u2014 internet check kijiye');
        });
      }
    }catch(e){}

  /* ---- order detail: add the Products section + the edit / lock control ---- */
  const _openOrderDetail = openOrderDetail;
  window.openOrderDetail = function(id){
    _openOrderDetail(id);
    const o = DB.orders().find(x => x.id === id); if(!o) return;

    const body = modal.querySelector('.modal-body');
    if(body){
      const sec = document.createElement('div');
      sec.innerHTML = '<div class="section-title">Products <span style="font-weight:500;color:var(--muted);font-size:11.5px">('+orderItems(o).length+')</span></div>'
                    + productsTableHTML(o);
      const titles = Array.prototype.slice.call(body.querySelectorAll('.section-title'));
      const dispatchTitle = titles.filter(t => /^dispatch$/i.test((t.textContent||'').trim()))[0];
      if(dispatchTitle) body.insertBefore(sec, dispatchTitle); else body.appendChild(sec);
      /* the products table needs the wide modal to show every column */
      if(orderItems(o).length) modal.classList.add('fb-wide');
    }

    const foot = modal.querySelector('.modal-foot');
    if(foot){
      const used = editsUsed(o), left = editsLeft(o);
      const ctl = document.createElement('div');
      ctl.style.cssText = 'display:flex;align-items:center;gap:9px;margin-right:auto';
      ctl.innerHTML = (isLocked(o)
        ? '<span class="chip c-neutral" title="An order form can be edited '+MAX_ORDER_EDITS+' times">Locked — '+used+'/'+MAX_ORDER_EDITS+' edits used</span>'
        : '<button class="btn" style="'+ORDER_EDIT_STYLE+'" onclick="openOrderModal(\''+o.id+'\')">'+I.edit+'Edit Order</button>'
          + '<span style="font-size:11.5px;color:var(--muted)">'+used+'/'+MAX_ORDER_EDITS+' edits used · '+left+' left</span>')
        /* Delete Order -- sirf Administrator, locked order par bhi available */
        + (isAdminNow()
            ? '<button class="btn" style="'+ORDER_DEL_STYLE+'" title="Delete this order permanently (admin only)" onclick="deleteOrderAdmin(\''+o.id+'\')">'+I.trash+'Delete Order</button>'
            : '');
      foot.insertBefore(ctl, foot.firstChild);
    }
  };

  /* ---- reopening a submitted order: refuse when locked, otherwise show the quota ---- */
  const _openOrderModal = openOrderModal;
  window.openOrderModal = function(id){
    const o = id ? DB.orders().find(x => x.id === id) : null;
    if(o && isLocked(o)){ toast('Order '+id+' is locked — all '+MAX_ORDER_EDITS+' edits have been used'); return; }
    _openOrderModal(id);
    if(!o) return;
    const body = modal.querySelector('.modal-body'); if(!body) return;
    const note = document.createElement('div');
    note.style.cssText = 'padding:9px 12px;margin-bottom:12px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;background:var(--surface-2);font-size:12.5px;color:var(--text-2)';
    note.innerHTML = 'Edit <strong>'+(editsUsed(o)+1)+' of '+MAX_ORDER_EDITS+'</strong> — saving counts as one edit of the whole form. After '+MAX_ORDER_EDITS+' edits this order is locked.';
    body.insertBefore(note, body.firstChild);
  };

  /* ---- count a successful update against the quota ---- */
  const _saveOrder = saveOrder;
  window.saveOrder = function(id){
    if(id){
      const o = DB.orders().find(x => x.id === id);
      if(o && isLocked(o)){ toast('Order form locked — no further changes allowed'); return; }
    }
    _saveOrder(id);
    /* the original closes the modal only when the record was really saved */
    if(id && !document.getElementById('o-items')){
      const list = DB.orders(), rec = list.find(x => x.id === id);
      if(rec){
        rec.editCount = editsUsed(rec) + 1;
        rec.lastEditedOn = today();
        if(rec.editCount >= MAX_ORDER_EDITS) rec.locked = true;
        DB.save('orders', list);
        toast(rec.locked
          ? 'Order updated — form is now locked ('+MAX_ORDER_EDITS+'/'+MAX_ORDER_EDITS+' edits used)'
          : 'Order updated — '+(MAX_ORDER_EDITS - rec.editCount)+' edit(s) left');
      }
    }
  };
})();

/* ============================================================================
   ORDER FORM AUTOMATION
   1. Total Amount        = Billing Amount + Freight Amount        (read-only)
   2. Pending Balance Amt = Total - Advance Payment - Full Payment (read-only)
   3. Full Payment Amount / Full Payment Proof show only when the order status
      is Dispatched or Delivered (hidden, not removed, so nothing is lost).
   4. Save Order is blocked until every mandatory (*) field is filled.
   Fields are matched by their Form Builder label, so renaming/recreating a
   field keeps working. Nothing else in the UI is touched.
   ============================================================================ */
(function(){
  const NORM = function(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); };
  const RX = {
    billing:   /^billing( amount| amt| value)?$/,
    freight:   /^freight( amount| amt| charge| charges)?$/,
    total:     /^(grand )?total( amount| amt| value)?$/,
    advance:   /^advance( payment)?( amount| amt)?$/,
    full:      /^full( payment)?( amount| amt)?$/,
    fullproof: /^full( payment)?( amount| amt)? proof$/,
    balance:   /balance/,
    /* Naye fields: Number of Boxes aur Box Amount (without GST) */
    boxes:     /^(number of |no of |total )?box(es)?$/,
    boxamt:    /^box(es)? amount( without gst| excl gst| ex gst)?$/
  };
  function oform(){ try{ return getForm('order') || []; }catch(e){ return []; } }
  function fidOf(kind){
    const L = oform();
    for(var i=0;i<L.length;i++){ if(L[i] && RX[kind].test(NORM(L[i].label))) return L[i].id; }
    return '';
  }
  function cfEl(id){ return id ? document.getElementById('cf-order-'+id) : null; }
  function cfRow(n){ return n && n.closest ? n.closest('.form-row') : null; }
  function money(v){ var n = parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; }
  function fmt(n){ return Math.round(n*100)/100; }
  const LOCKCSS = 'background:var(--surface-2);color:var(--text-2);cursor:not-allowed';

  function lockField(node, hint){
    if(!node || node.dataset.ocAuto) return;
    node.dataset.ocAuto = '1';
    node.readOnly = true;
    node.tabIndex  = -1;
    node.style.cssText += ';' + LOCKCSS;
    const r = cfRow(node), lb = r && r.querySelector('label');
    if(lb && hint && !lb.querySelector('.oc-auto-hint')){
      const s = document.createElement('span');
      s.className = 'oc-auto-hint';
      s.style.cssText = 'font-weight:500;font-size:10.5px;color:var(--muted);margin-left:6px';
      s.textContent = hint;
      lb.appendChild(s);
    }
  }
  function finalStage(){
    const v = NORM((document.getElementById('o-stat')||{}).value);
    return v === 'dispatched' || v === 'delivered';
  }
  function boxCount(){ const n = cfEl(fidOf('boxes')); return n ? money(n.value) : 0; }
  /* Box Amount (without GST) sirf tab kaam ka hai jab Number of Boxes
     0 se zyada ho. 0 ya khali hone par field chhup jaata hai aur uska
     amount Total me bhi nahi jodha jaata. */
  function boxAmount(){
    const n = cfEl(fidOf('boxamt'));
    if(!n || !(boxCount() > 0)) return 0;
    return money(n.value);
  }
  function toggleBoxAmount(){
    const r = cfRow(cfEl(fidOf('boxamt')));
    if(r) r.style.display = (boxCount() > 0) ? '' : 'none';
  }
  function recalcMoney(){
    const t  = cfEl(fidOf('total')),   b  = cfEl(fidOf('billing')), f = cfEl(fidOf('freight'));
    const bl = cfEl(fidOf('balance')), a  = cfEl(fidOf('advance')), u = cfEl(fidOf('full'));
    toggleBoxAmount();
    const total = money(b && b.value) + money(f && f.value) + boxAmount();
    if(t)  t.value  = fmt(total);
    if(bl) bl.value = fmt(total - money(a && a.value) - money(u && u.value));
  }
  function toggleFullPayment(){
    const show = finalStage();
    [fidOf('full'), fidOf('fullproof')].forEach(function(id){
      const r = cfRow(cfEl(id));
      if(r) r.style.display = show ? '' : 'none';
    });
    recalcMoney();
  }
  function initOrderForm(){
    if(!document.getElementById('o-items')) return;
    lockField(cfEl(fidOf('total')),   '(auto: Billing + Freight + Box Amount)');
    lockField(cfEl(fidOf('balance')), '(auto: Total - Advance - Full Payment)');
    ['billing','freight','advance','full','boxes','boxamt'].forEach(function(k){
      const n = cfEl(fidOf(k));
      if(n && !n.dataset.ocBound){ n.dataset.ocBound = '1'; n.addEventListener('input', recalcMoney); n.addEventListener('change', recalcMoney); }
    });
    const st = document.getElementById('o-stat');
    if(st && !st.dataset.ocBound){ st.dataset.ocBound = '1'; st.addEventListener('change', toggleFullPayment); }
    toggleBoxAmount();
    toggleFullPayment();
  }

  const _ocOpenOrderModal = window.openOrderModal;
  window.openOrderModal = function(id){
    window.__ocOrderEditId = id || '';
    _ocOpenOrderModal(id);
    setTimeout(initOrderForm, 0);
  };

  function prevCustom(){
    const id = window.__ocOrderEditId;
    if(!id) return {};
    const o = (DB.orders()||[]).filter(function(x){ return x && x.id === id; })[0];
    return (o && o.custom) || {};
  }

  /* a file input can never be pre-filled, so keep the file that was uploaded earlier */
  const _ocReadOrderCustom = window.readOrderCustom;
  window.readOrderCustom = function(){
    const c = _ocReadOrderCustom(), prev = prevCustom();
    oform().forEach(function(f){
      if(!f || f.type !== 'file') return;
      const n = cfEl(f.id);
      if(n && !(n.files && n.files.length) && prev[f.id] && !c[f.id]) c[f.id] = prev[f.id];
    });
    return c;
  };

  function missingFields(){
    const miss = [], F = oform(), byId = {};
    F.forEach(function(f){ if(f) byId[f.id] = f; });
    [['o_cust','o-cust','Customer'],['o_sales','o-sales','Salesperson'],['o_pay','o-pay','Payment'],['o_stat','o-stat','Status']].forEach(function(t){
      const f = byId[t[0]];
      if(f && !f.required) return;
      const n = document.getElementById(t[1]);
      if(n && !String(n.value||'').trim()) miss.push({ label:(f && f.label) || t[2], node:n });
    });
    const ptf = (typeof orderProductTypeField === 'function') ? orderProductTypeField() : null;
    if(ptf && ptf.required){
      const pe = document.getElementById('o-ptype');
      if(pe && !String(pe.value||'').trim()) miss.push({ label: ptf.label || 'Product Type', node: pe });
    }
    const prev = prevCustom();
    F.forEach(function(f){
      if(!f || !f.required || f.type === 'checkbox') return;
      const n = cfEl(f.id);
      if(!n) return;
      const r = cfRow(n);
      if(r && r.style.display === 'none') return;
      if(f.type === 'file'){
        const has = (n.files && n.files.length) || String(prev[f.id]||'').trim();
        if(!has) miss.push({ label:f.label, node:n });
        return;
      }
      if(!String(n.value==null?'':n.value).trim()) miss.push({ label:f.label, node:n });
    });
    document.querySelectorAll('#o-items [data-row]').forEach(function(row){
      var ri = row.getAttribute('data-row');
      var checks = [
        ['.oi-type','Order Type'],
        /* Pehle yahan hidden .oi-prod check hota tha jo hamesha bhara
           mila karta tha (default pehla product). Ab jo field user ko
           dikhti hai wahi check hoti hai. */
        [(row.querySelector('.oi-name') ? '.oi-name' : (row.querySelector('.oi-search') ? '.oi-search' : '.oi-prod')),'Product Name'],
        ['.oi-qty','Qty'],
        ['.oi-rate','Rate (without GST)'],
        ['.oi-spec','Product Specification']
      ];
      checks.forEach(function(c){
        var el = row.querySelector(c[0]);
        if(!el) return;
        var v = String(el.value==null?'':el.value).trim();
        var bad = (!v) || ((c[0]=='.oi-qty'||c[0]=='.oi-rate') && !(parseFloat(v)>0));
        if(bad) miss.push({ label:c[1]+' (Product '+(parseInt(ri,10)+1)+')', node:el });
      });
      var img = row.querySelector('.oi-img');
      if(img){
        var hasImg = (img.files && img.files.length) || row.querySelector('.oi-img-prev, [data-imgset], img.oi-thumb') || (window.__orderItems[ri] && window.__orderItems[ri].image);
        if(!hasImg) miss.push({ label:'Item Image (Product '+(parseInt(ri,10)+1)+')', node:img });
      }
    });
    return miss;
  }
  window.__ocMissingOrderFields = missingFields;

  const _ocSaveOrder = window.saveOrder;
  window.saveOrder = function(id){
    if(document.getElementById('o-items')){
      recalcMoney();
      const miss = missingFields();
      if(miss.length){
        miss.forEach(function(m){
          if(!m.node) return;
          m.node.style.borderColor = 'var(--crit)';
          if(!m.node.dataset.ocClr){
            m.node.dataset.ocClr = '1';
            const clr = function(){ m.node.style.borderColor = ''; };
            m.node.addEventListener('input', clr); m.node.addEventListener('change', clr);
          }
        });
        const names = miss.map(function(m){ return m.label; });
        toast('Please fill the required field' + (names.length>1?'s':'') + ': ' + names.slice(0,4).join(', ') + (names.length>4 ? ' +' + (names.length-4) + ' more' : ''));
        try{ miss[0].node.scrollIntoView({block:'center', behavior:'smooth'}); miss[0].node.focus({preventScroll:true}); }catch(e){}
        return;
      }
    }
    _ocSaveOrder(id);
  };
})();

/* ════════════════════════════════════════════════════════════════════════════
   ORDER FORM AUTOMATION - PART 2
   1. "Freight Charge Proof" shows only when Freight Amount is greater than 0.
   2. "Tax Invoice" shows only when Status is Dispatched or Delivered.
   3. "Billing Amount" is auto-filled with the Products table total (qty x rate)
      and is read-only. Fields are matched by their Form Builder label.
   ════════════════════════════════════════════════════════════════════════════ */
(function(){
  const NORM = function(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); };
  const RX = {
    billing:      /^billing( amount| amt| value)?$/,
    freight:      /^freight( amount| amt| charge| charges)?$/,
    freightproof: /^freight( amount| amt| charge| charges)? proof$/,
    taxinvoice:   /^tax ?invoice( proof| copy| upload| document)?$/
  };
  function oform(){ try{ return getForm('order') || []; }catch(e){ return []; } }
  function fidOf(kind){
    const L = oform();
    for(var i=0;i<L.length;i++){ if(L[i] && RX[kind].test(NORM(L[i].label))) return L[i].id; }
    return '';
  }
  function cfEl(id){ return id ? document.getElementById('cf-order-'+id) : null; }
  function cfRow(n){ return n && n.closest ? n.closest('.form-row') : null; }
  function money(v){ var n = parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; }
  function show(node, on){ const r = cfRow(node); if(r) r.style.display = on ? '' : 'none'; }
  function finalStage(){
    const v = NORM((document.getElementById('o-stat')||{}).value);
    return v === 'dispatched' || v === 'delivered';
  }
  function itemsTotal(){
    const list = window.__orderItems || [];
    return list.reduce(function(s,it){ return s + ((+it.rate||0) * (+it.qty||0)); }, 0);
  }
  function syncBilling(){
    const b = cfEl(fidOf('billing'));
    if(!b) return;
    const v = Math.round(itemsTotal()*100)/100;
    if(String(b.value) !== String(v)){
      b.value = v;
      b.dispatchEvent(new Event('input',  {bubbles:true}));
      b.dispatchEvent(new Event('change', {bubbles:true}));
    }
  }
  function lockBilling(){
    const b = cfEl(fidOf('billing'));
    if(!b || b.dataset.ocBillLock) return;
    b.dataset.ocBillLock = '1';
    b.readOnly = true; b.tabIndex = -1;
    b.style.cssText += ';background:var(--surface-2);color:var(--text-2);cursor:not-allowed';
    const r = cfRow(b), lb = r && r.querySelector('label');
    if(lb && !lb.querySelector('.oc-bill-hint')){
      const s = document.createElement('span');
      s.className = 'oc-bill-hint';
      s.style.cssText = 'font-weight:500;font-size:10.5px;color:var(--muted);margin-left:6px';
      s.textContent = '(auto: total of all products)';
      lb.appendChild(s);
    }
  }
  function toggleFreightProof(){
    const f = cfEl(fidOf('freight'));
    show(cfEl(fidOf('freightproof')), money(f && f.value) > 0);
  }
  function toggleTaxInvoice(){ show(cfEl(fidOf('taxinvoice')), finalStage()); }

  const _ocUpdateOrderTotal = window.updateOrderTotal;
  window.updateOrderTotal = function(){
    if(typeof _ocUpdateOrderTotal === 'function') _ocUpdateOrderTotal.apply(this, arguments);
    syncBilling(); toggleFreightProof();
  };

  function initOrderFormExtra(){
    if(!document.getElementById('o-items')) return;
    lockBilling();
    const f = cfEl(fidOf('freight'));
    if(f && !f.dataset.ocFpBound){
      f.dataset.ocFpBound = '1';
      f.addEventListener('input',  toggleFreightProof);
      f.addEventListener('change', toggleFreightProof);
    }
    const st = document.getElementById('o-stat');
    if(st && !st.dataset.ocTiBound){
      st.dataset.ocTiBound = '1';
      st.addEventListener('change', toggleTaxInvoice);
    }
    const box = document.getElementById('o-items');
    if(box && !box.dataset.ocLiveBound){
      box.dataset.ocLiveBound = '1';
      box.addEventListener('input', function(e){
        const t = e.target;
        if(t && t.classList && (t.classList.contains('oi-qty') || t.classList.contains('oi-rate'))){
          if(typeof readOrderItems === 'function') readOrderItems();
          if(typeof updateOrderTotal === 'function') updateOrderTotal();
        }
      });
    }
    syncBilling(); toggleFreightProof(); toggleTaxInvoice();
  }

  const _ocOpenOrderModal2 = window.openOrderModal;
  window.openOrderModal = function(id){
    _ocOpenOrderModal2.apply(this, arguments);
    setTimeout(initOrderFormExtra, 0);
  };
})();

/* ===== Drive uploads: read a chosen file into a data URL so the backend can store it in Drive ===== */
(function(){
  var MAXB = 10 * 1024 * 1024;
  function grab(el){
    var f = el.files && el.files[0];
    if(!f){ el.__ocData = ''; return; }
    if(f.size > MAXB){ el.value = ''; el.__ocData = ''; try{ toast('File too large (max 10 MB): ' + f.name); }catch(e){} return; }
    var rd = new FileReader();
    el.__ocBusy = 1;
    rd.onload = function(e){
      var s = String(e.target.result || ''), i = s.indexOf(';base64,');
      if(i > 0) s = s.slice(0,i) + ';name=' + encodeURIComponent(f.name) + s.slice(i);
      el.__ocData = s; el.__ocBusy = 0;
    };
    rd.onerror = function(){ el.__ocData = ''; el.__ocBusy = 0; };
    rd.readAsDataURL(f);
  }
  document.addEventListener('change', function(ev){
    var el = ev.target;
    if(el && el.tagName === 'INPUT' && el.type === 'file' && el.id !== 'bulkFile') grab(el);
  }, true);
  var base = window.readCustomFields;
  if(typeof base === 'function'){
    window.readCustomFields = function(which){
      var out = base.apply(this, arguments);
      try{
        (customFieldsFor(which) || []).forEach(function(f){
          if(!f || f.type !== 'file') return;
          var el = document.getElementById('cf-' + which + '-' + f.id) || document.getElementById(which + '-' + f.id);
          if(!el) return;
          if(el.__ocData) out[f.id] = el.__ocData;
          else if(typeof out[f.id] === 'string' && out[f.id].indexOf('fakepath') > -1) out[f.id] = '';
        });
      }catch(e){}
      return out;
    };
  }
})();

/* ==================================================================
   DATE DISPLAY FORMAT  ->  DD/MM/YYYY
   Data layer ISO (YYYY-MM-DD) hi rehta hai -- date inputs, sorting,
   Excel aur Google Sheet sab usi par chalte hain. Sirf jo user ko
   screen par (aur WhatsApp text me) dikhta hai wo DD/MM/YYYY ho
   jaata hai. Baaki UI / functionality ko chhua nahi gaya.
   ================================================================== */
(function(){
  var ISO = /^(\d{4})-(\d{2})-(\d{2})(?:[T ].*)?$/;
  function dmy(v){
    if(v === null || v === undefined) return v;
    var m = String(v).trim().match(ISO);
    return m ? (m[3] + '/' + m[2] + '/' + m[1]) : v;
  }
  window.ocDMY = dmy;

  var RX = /(\d{4})-(\d{2})-(\d{2})(?![\d-])/g;
  var SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1, INPUT:1, SELECT:1, OPTION:1, NOSCRIPT:1, IFRAME:1, CANVAS:1 };

  function walk(node){
    for(var c = node.firstChild; c; c = c.nextSibling){
      if(c.nodeType === 3){
        var t = c.nodeValue;
        if(t && t.length > 9 && t.indexOf('-') > 0){
          RX.lastIndex = 0;
          if(RX.test(t)){ RX.lastIndex = 0; c.nodeValue = t.replace(RX, '$3/$2/$1'); }
        }
      } else if(c.nodeType === 1 && !SKIP[c.tagName] && !c.isContentEditable){
        walk(c);
      }
    }
  }

  var queued = false;
  function sweep(){ queued = false; try{ if(document.body) walk(document.body); }catch(e){} }
  function later(){ if(queued) return; queued = true; setTimeout(sweep, 0); }

  function start(){
    if(!document.body){ setTimeout(start, 50); return; }
    sweep();
    try{ new MutationObserver(later).observe(document.body, { childList:true, subtree:true, characterData:true }); }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  /* WhatsApp message me bhi DD/MM/YYYY jaaye */
  if(typeof window.orderWaText === 'function'){
    var _waText = window.orderWaText;
    window.orderWaText = function(){
      return String(_waText.apply(this, arguments) || '').replace(RX, '$3/$2/$1');
    };
  }
})();


/* ════════════════════════════════════════════════════════════════════════════
   OAKCRAFT — INCENTIVE DASHBOARD + BILLING GST + FILE VISIBILITY  (added feature)
   ---------------------------------------------------------------------------
   • Per-user incentive (Weekly / Monthly / Last Month) — uses scope() so each
     user sees only their own orders.
   • Weekly target ₹1,30,000; if week total >= target -> 1.5% of week total, else 0.
   • Week = Monday 00:00 .. Sunday 23:59. A Monday sale rolls into the new week.
   • Monthly = sum of every completed/partial week incentive inside the month's
     cycle (first Monday of month .. first Monday of next month). On the first
     Monday it resets to ₹0 automatically; the closing cycle total is stored and
     shown in "Last Month Incentive".
   • Billing Amount always shows GST-inclusive (products total × 1.18), for both
     the live order form and already-saved orders.
   • Every uploaded file stays visible (order detail drawer + inside the form).
   Cancelled orders never count toward sales.
   ════════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var GST = 0.18, WEEK_TARGET = 130000, RATE = 0.015;

  /* ---- GST-inclusive billing amount for any order record ---- */
  function billGST(o){ return Math.round(((+((o||{}).amount)||0) * (1+GST))*100)/100; }
  window.orderBillingWithGST = billGST;

  /* ---- date helpers (local time) ---- */
  function toDate(s){ if(!s) return null; var d=new Date(String(s).slice(0,10)+'T00:00:00'); return isNaN(d.getTime())?null:d; }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  /* Monday (0=Sun..6=Sat -> shift so Monday is start) of the week containing d */
  function weekStart(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
  function weekKey(d){ return ymd(weekStart(d)); }
  /* first Monday of the month containing d */
  function firstMonday(y,m){ var x=new Date(y,m,1); var wd=(x.getDay()+6)%7; x.setDate(x.getDate()+((7-wd)%7)); return x; }
  /* the monthly-cycle start Monday for a given date: first Monday of its month,
     but if d is before that first Monday it belongs to the previous month's cycle */
  function cycleStart(d){ var fm=firstMonday(d.getFullYear(),d.getMonth()); if(d<fm){ var pm=new Date(d.getFullYear(),d.getMonth()-1,1); return firstMonday(pm.getFullYear(),pm.getMonth()); } return fm; }
  function cycleEnd(startMon){ var d=new Date(startMon); var nm=new Date(d.getFullYear(),d.getMonth()+1,1); return firstMonday(nm.getFullYear(),nm.getMonth()); }

  /* ---- gather this user's counting orders (exclude Cancelled) ---- */
  function myOrders(){
    var list=[]; try{ list=scope(DB.orders(),'orders')||[]; }catch(e){ try{ list=DB.orders()||[]; }catch(_){ list=[]; } }
    return list.filter(function(o){ return o && o.status!=='Cancelled'; });
  }

  /* ---- weekly sales totals keyed by week-start Monday ---- */
  function weeklyTotals(orders){
    var map={};
    (orders||[]).forEach(function(o){
      var d=toDate(o.date); if(!d) return;
      var k=weekKey(d); map[k]=(map[k]||0)+billGST(o);
    });
    return map;
  }
  function weekIncentive(total){ return total>=WEEK_TARGET ? Math.round(total*RATE*100)/100 : 0; }

  /* ---- per-user localStorage key for the stored "last month" figure ---- */
  function meKey(){ var e=''; try{ e=((AUTH.current()||{}).email||'').toLowerCase(); }catch(_){ } return 'oc_incentive_'+(e||'anon'); }
  function loadStore(){ try{ return JSON.parse(localStorage.getItem(meKey())||'{}')||{}; }catch(e){ return {}; } }
  function saveStore(o){ try{ localStorage.setItem(meKey(), JSON.stringify(o)); }catch(e){} }

  /* Sum incentive for one monthly cycle [start, end) from weekly totals. */
  function cycleIncentive(wt, startMon, endMon){
    var sum=0;
    Object.keys(wt).forEach(function(k){
      var ws=toDate(k); if(!ws) return;
      if(ws>=startMon && ws<endMon) sum+=weekIncentive(wt[k]);
    });
    return Math.round(sum*100)/100;
  }

  function computeIncentive(){
    var orders=myOrders(), wt=weeklyTotals(orders);
    var now=new Date();
    var thisWeekTotal = wt[weekKey(now)]||0;
    var weekly = weekIncentive(thisWeekTotal);

    var cs=cycleStart(now), ce=cycleEnd(cs);
    var monthly = cycleIncentive(wt, cs, ce);

    /* previous cycle (the one that just closed on this cycle's start Monday) */
    var prevStart=new Date(cs); var pm=new Date(cs.getFullYear(),cs.getMonth()-1,1); prevStart=firstMonday(pm.getFullYear(),pm.getMonth());
    var prevCalc = cycleIncentive(wt, prevStart, cs);

    /* persist rollover: when the current cycle changes, freeze the previous total */
    var st=loadStore(), curKey=ymd(cs);
    var lastMonth;
    if(st.cycleKey===curKey){
      lastMonth = (st.lastMonth!=null)?st.lastMonth:prevCalc;
    } else {
      /* cycle rolled over (or first run) — store previous cycle's total as Last Month */
      lastMonth = prevCalc;
      saveStore({cycleKey:curKey, lastMonth:lastMonth});
    }
    return { weekly:weekly, monthly:monthly, lastMonth:lastMonth, weekTotal:thisWeekTotal };
  }
  window.computeIncentive = computeIncentive;

  function inr(n){ try{ return money(n); }catch(e){ return '₹'+Number(n||0).toLocaleString('en-IN'); } }

  /* ==================================================================
     ROLE GATE — Incentive dashboard sirf un users ko dikhega jinka role

  function isSalesRole(role){

  /* ---- ek order ki total quantity ---- */
  function orderQty(o){
    var q = +(((o || {}).qty)) || 0;
    if(q) return q;
    var items = (o && o.items) || [];
    return items.reduce(function(s, it){ return s + (+((it || {}).qty) || 0); }, 0);
  }

  /* ---- chalu month-cycle ke andar ke weeks (4 ya 5) ---- */
  function cycleWeeks(cs, ce){
    var out = [], d = new Date(cs), i = 0;
    while(d < ce && i < 6){
      var nx = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7);
      out.push({ no: i + 1, start: new Date(d), end: (nx < ce ? nx : new Date(ce)) });
      d = nx; i++;
    }
    return out;
  }
  function dLabel(d){ return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }

  /* ---- kisi bhi orders list ka poora metric set ---- */
  function metricsFor(list){
    var orders = (list || []).filter(function(o){ return o && o.status !== 'Cancelled'; });
    var wt = weeklyTotals(orders);
    var now = new Date();
    var cs = cycleStart(now), ce = cycleEnd(cs);
    var pmd = new Date(cs.getFullYear(), cs.getMonth() - 1, 1);
    var ps = firstMonday(pmd.getFullYear(), pmd.getMonth());

    var inCycle = orders.filter(function(o){ var d = toDate(o.date); return d && d >= cs && d < ce; });
    var totalSales = 0, topOrder = 0, totalQty = 0;
    inCycle.forEach(function(o){
      var v = billGST(o);
      totalSales += v;
      if(v > topOrder) topOrder = v;
      totalQty += orderQty(o);
    });
    var cnt = inCycle.length;
    var thisWeekTotal = wt[weekKey(now)] || 0;

    var weeks = cycleWeeks(cs, ce).map(function(w){
      var sales = wt[ymd(w.start)] || 0;
      return { no: w.no, start: w.start, end: w.end,
               sales: Math.round(sales * 100) / 100,
               incentive: weekIncentive(sales),
               current: (now >= w.start && now < w.end) };
    });

    return {
      weekTarget: WEEK_TARGET,
      weekSales : Math.round(thisWeekTotal * 100) / 100,
      weekly    : weekIncentive(thisWeekTotal),
      totalSales: Math.round(totalSales * 100) / 100,
      orders    : cnt,
      avgOrder  : cnt ? Math.round((totalSales / cnt) * 100) / 100 : 0,
      topOrder  : Math.round(topOrder * 100) / 100,
      totalQty  : totalQty,
      weeks     : weeks,
      monthly   : cycleIncentive(wt, cs, ce),
      lastMonth : cycleIncentive(wt, ps, cs),
      cycleStart: cs,
      cycleEnd  : ce

  }

  /* ---- IMAGE LIGHTBOX: click any uploaded image to see it full screen ---- */
  function bigSrc(v){ if(isHttp(v)){ var id=driveId(v); return id?('https://drive.google.com/thumbnail?id='+id+'&sz=w2000'):v; } return v; }
  function ensureLightbox(){

  window.ocZoom=function(key){ var v=window.__ocFileMap&&window.__ocFileMap[key]; if(v) window.ocZoomSrc(v, fileName(v)); };

  var _cfh=window.customFieldsHTML;
  window.customFieldsHTML=function(which, rec, group){

      var cv=(rec&&rec.custom)||{};
      var list=(typeof customFieldsFor==='function')?customFieldsFor(which):[];
      list.forEach(function(f){
        if(!f||f.type!=='file') return;
        if(which==='order' && typeof orderFieldGroup==='function' && orderFieldGroup(f)!==(group||'other')) return;
        var v=cv[f.id];
        if(!isDataUrl(v)) return;
        var dom='cf-'+which+'-'+f.id;
        /* insert the preview right after this field's input container */
        var marker='id="'+dom+'"';
        var pos=html.indexOf(marker);
        if(pos<0) return;

  /* Order detail drawer: add a "Documents & Uploads" section listing every file. */
  var _ood=window.openOrderDetail;

        var titles=Array.prototype.slice.call(mb.querySelectorAll('.section-title'));

        if(prog) mb.insertBefore(sec, prog); else mb.appendChild(sec);

  /* Keep previously-uploaded files when re-saving without choosing a new file.
     (The base readCustomFields wrapper already merges prev values for missing

      the sheet backend drops them.) */
  var _roc=window.readOrderCustom;

    var c=(typeof _roc==='function')?_roc.apply(this, arguments):{};

      oform().forEach(function(f){
        if(!f||f.type!=='file') return;
        if(!isDataUrl(c[f.id]) && isDataUrl(prev[f.id])) c[f.id]=prev[f.id];
      });

    return c;
  };
})();


/* ============================================================================
   ITEM IMAGE ZOOM — every product image inside an order becomes clickable and
   opens full-screen. The Products table is rendered by an earlier block, so we
   upgrade its <img> tags after the drawer/form opens instead of rewriting it.
   ========================================================================== */
(function(){
  'use strict';
  function upgrade(root){
    if(!root) return;
    Array.prototype.forEach.call(root.querySelectorAll('img'), function(im){
      if(im.dataset.ocZoomable) return;
      var src=im.getAttribute('src')||'';
      if(!src) return;
      if(im.closest && im.closest('.cell-user')) return;   /* skip avatars */
      im.dataset.ocZoomable='1';
      im.style.cursor='zoom-in';
      if(!im.title) im.title='Click to zoom';
      im.addEventListener('click', function(ev){
        ev.preventDefault(); ev.stopPropagation();
        if(typeof window.ocZoomSrc==='function') window.ocZoomSrc(src, im.getAttribute('alt')||'');
      });
    });
  }
  function upgradeModal(){ try{ var m=document.getElementById('modal'); if(m) upgrade(m); }catch(e){} }

  var _d=window.openOrderDetail;
  if(typeof _d==='function'){
    window.openOrderDetail=function(id){ _d.apply(this,arguments); setTimeout(upgradeModal,0); setTimeout(upgradeModal,120); };
  }
  var _r=window.renderOrderItems;
  if(typeof _r==='function'){
    window.renderOrderItems=function(){ _r.apply(this,arguments); setTimeout(upgradeModal,0); };
  }
  try{
    var host=document.getElementById('modalBg');
    if(host) new MutationObserver(function(){ upgradeModal(); }).observe(host,{childList:true,subtree:true});
  }catch(e){}
})();

/* ============================================================================
   ORDER DETAIL - FULL FIELD VISIBILITY (v3)
   Every order, after the form is submitted, now shows inside its detail drawer:
     - Billing & Payment Details  (Products Total, GST 18%, Billing Amount
       incl. GST, Freight Amount, Total, Advance, Pending Balance, ...)
     - Documents & Uploads        (Proforma Invoice, Tax Invoice, Advance
       Payment Proof, Full Amount Proof, Freight Charge Proof, product images)
       with thumbnail + Zoom (full screen) + View + Download for each file.
   ========================================================================== */
(function(){
  'use strict';

  function S(v){ return v==null ? '' : String(v); }
  function isData(v){ return /^data:/i.test(S(v)); }
  function isHttp(v){ return /^https?:\/\//i.test(S(v)); }
  function isFake(v){ return /fakepath/i.test(S(v)); }
  function hasFile(v){ return isData(v) || isHttp(v); }
  function dId(v){ var m = S(v).match(/[-\w]{25,}/); return m ? m[0] : ''; }
  function dThumb(v){ if(isData(v)) return v; var i=dId(v); return i ? 'https://drive.google.com/thumbnail?id='+i+'&sz=w400' : v; }
  function dBig(v){ if(isData(v)) return v; var i=dId(v); return i ? 'https://drive.google.com/thumbnail?id='+i+'&sz=w2000' : v; }
  function dView(v){ if(isData(v)) return v; var i=dId(v); return i ? 'https://drive.google.com/file/d/'+i+'/view' : v; }
  function dDown(v){ if(isData(v)) return v; var i=dId(v); return i ? 'https://drive.google.com/uc?export=download&id='+i : v; }
  function nameOf(v){
    if(isFake(v)) return S(v).split(/[\\/]/).pop();
    if(isData(v)) return 'attachment';
    var i = dId(v); if(i) return 'Drive file ('+i.slice(0,6)+'\u2026)';
    return S(v).split('/').pop().slice(0,44) || 'file';
  }
  function esc(v){ return S(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function inr(n){ n = Number(n)||0; return '\u20b9' + n.toLocaleString('en-IN',{maximumFractionDigits:2}); }

  window.__ocDocs = window.__ocDocs || {};
  window.ocDocZoom = function(k){
    var d = window.__ocDocs[k];
    if(d && typeof window.ocZoomSrc === 'function') window.ocZoomSrc(d.big, d.label);
  };

  var ROW = 'display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)';
  var LBL = 'color:var(--text-2);font-size:13px';
  var VAL = 'font-weight:650;font-size:13px';
  function row(label, value, strong){
    return '<div style="'+ROW+'"><span style="'+LBL+'">'+esc(label)+'</span>'
      + '<span class="tabular" style="'+VAL+(strong ? ';font-size:14px' : '')+'">'+esc(value)+'</span></div>';
  }

  var BOX = 'display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)';
  var THUMB = 'width:46px;height:46px;flex:0 0 46px;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);cursor:zoom-in';
  var PLACE = 'width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:8px;font-size:10px;font-weight:700;color:var(--muted)';
  var kc = 0;

  function docCard(label, v){
    var icon, sub, btns = '';
    if(hasFile(v)){
      var key = 'd' + (++kc);
      window.__ocDocs[key] = { big: dBig(v), label: label };
      icon = '<img src="'+esc(dThumb(v))+'" alt="" title="Click to zoom" style="'+THUMB+'" onclick="ocDocZoom(&quot;'+key+'&quot;)" onerror="this.style.visibility=&quot;hidden&quot;">';
      sub  = '<span style="color:var(--muted)">'+esc(nameOf(v))+' \u2014 saved, always available</span>';
      btns = '<button type="button" class="btn sm" onclick="ocDocZoom(&quot;'+key+'&quot;)">Zoom</button>'
           + '<a class="btn sm" href="'+esc(dView(v))+'" target="_blank" rel="noopener">View</a>'
           + '<a class="btn sm" href="'+esc(dDown(v))+'" target="_blank" rel="noopener">Download</a>';
    } else if(isFake(v)){
      icon = '<div style="'+PLACE+'">!</div>';
      sub  = '<span style="color:#b45309">'+esc(nameOf(v))+' \u2014 file was never uploaded on this old order. Use Edit Order to upload it again.</span>';
    } else {
      icon = '<div style="'+PLACE+'">--</div>';
      sub  = '<span style="color:var(--muted)">Not uploaded</span>';
    }
    return '<div style="'+BOX+'">'
      + icon
      + '<div style="flex:1;min-width:0">'
      +   '<div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(label)+'</div>'
      +   '<div style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+sub+'</div>'
      + '</div>'
      + btns
      + '</div>';
  }
  window.__ocDocCard = docCard;

  function titles(mb){ return Array.prototype.slice.call(mb.querySelectorAll('.section-title')); }
  function titleNamed(mb, re){
    var t = titles(mb).filter(function(x){ return re.test(S(x.textContent).trim()); })[0];
    return t || null;
  }
  function makeSection(titleHTML, bodyHTML){
    var d = document.createElement('div');
    d.setAttribute('data-oc-full','1');
    d.innerHTML = '<div class="section-title">' + titleHTML + '</div>' + bodyHTML;
    return d;
  }
  function shownLabels(mb){
    var set = {};
    Array.prototype.forEach.call(mb.querySelectorAll('div'), function(d){
      if(d.children.length === 2 && d.children[0].tagName === 'SPAN' && d.children[1].tagName === 'SPAN'){
        set[S(d.children[0].textContent).trim().toLowerCase()] = 1;
      }
    });
    return set;
  }

  function enhance(id){
    var list = (typeof DB !== 'undefined' && DB.orders) ? (DB.orders() || []) : [];
    var o = list.filter(function(x){ return x && x.id === id; })[0];
    if(!o) return;
    var m = document.getElementById('modal');
    var mb = m ? m.querySelector('.modal-body') : null;
    if(!mb) return;

    Array.prototype.forEach.call(mb.querySelectorAll('[data-oc-full]'), function(n){ n.remove(); });
    titles(mb).forEach(function(t){
      if(/^documents\s*&\s*uploads/i.test(S(t.textContent).trim())){
        var host = t.parentElement;
        if(host && host !== mb) host.remove(); else t.remove();
      }
    });

    var cv = o.custom || {};
    var fields = (typeof getForm === 'function') ? (getForm('order') || []) : [];
    var already = shownLabels(mb);
    function fieldBy(re){ return fields.filter(function(f){ return f && re.test(S(f.label)); })[0] || null; }

    var amt = Number(o.amount) || 0;
    var fFreight = fieldBy(/freight\s*amount/i);
    var freight = fFreight ? (Number(cv[fFreight.id]) || 0) : 0;
    /* Freight ke theek neeche Number of Boxes aur Box Amount (without GST).
       Box Amount tabhi dikhta hai jab boxes 0 se zyada ho, aur wahi amount
       Total Amount me bhi jud jaata hai. */
    var fBoxes  = fieldBy(/^\s*(number of|no\.?\s*of)?\s*box(es)?\s*$/i);
    var boxes   = fBoxes ? (Number(cv[fBoxes.id]) || 0) : 0;
    var fBoxAmt = fieldBy(/box(es)?\s*amount/i);
    var boxAmt  = (fBoxAmt && boxes > 0) ? (Number(cv[fBoxAmt.id]) || 0) : 0;
    var bill = amt * 1.18;

    var pay = row('Products Total (excl. GST)', inr(amt))
            + row('GST 18%', inr(amt * 0.18))
            + row('Billing Amount (incl. 18% GST)', inr(bill), true)
            + row('Freight Amount', inr(freight))
            + row((fBoxes && fBoxes.label) || 'Number of Boxes', boxes)
            + (boxes > 0 ? row((fBoxAmt && fBoxAmt.label) || 'Box Amount (without GST)', inr(boxAmt)) : '')
            + row('Total Amount', inr(bill + freight + boxAmt), true);

    var moneyRe = /(amount|amt|balance|paid|price|value|charge)/i;
    var skipRe  = /^(billing amount|freight amount|total amount|number of boxes|box(es)? amount(\s*\(without gst\))?)$/i;
    fields.forEach(function(f){
      if(!f || f.type === 'file') return;
      var lab = S(f.label).trim();
      if(!lab || skipRe.test(lab)) return;
      if(already[lab.toLowerCase()]) return;
      var v = cv[f.id];
      if(v === undefined || v === null || v === '') return;
      pay += row(lab, (moneyRe.test(lab) && !isNaN(Number(v))) ? inr(v) : v);
    });

    kc = 0;
    var docs = '', total = 0, up = 0;
    fields.forEach(function(f){
      if(!f || f.type !== 'file') return;
      total++;
      var v = cv[f.id];
      if(hasFile(v)) up++;
      docs += docCard(S(f.label) || 'File', v);
    });
    (o.items || []).forEach(function(it, i){
      if(!it || !hasFile(it.image)) return;
      total++; up++;
      docs += docCard('Item ' + (i + 1) + ' Image' + (it.name ? ' \u2014 ' + it.name : ''), it.image);
    });

    var counter = '<span style="font-weight:500;color:var(--muted);font-size:11.5px">(' + up + ' of ' + total + ' uploaded)</span>';
    var secPay  = makeSection('Billing &amp; Payment Details', pay);
    var secDocs = makeSection('Documents &amp; Uploads ' + counter,
                    docs + '<div style="font-size:11px;color:var(--muted);margin-top:8px">Click any thumbnail or Zoom to open the file full screen. View opens the original, Download saves a copy.</div>');

    var anchor = titleNamed(mb, /^dispatch$/i) || titleNamed(mb, /^progress$/i);
    if(anchor && anchor.parentElement === mb){
      mb.insertBefore(secPay, anchor);
      mb.insertBefore(secDocs, anchor);
    } else if(anchor && anchor.parentElement && anchor.parentElement.parentElement === mb){
      mb.insertBefore(secPay, anchor.parentElement);
      mb.insertBefore(secDocs, anchor.parentElement);
    } else {
      mb.appendChild(secPay);
      mb.appendChild(secDocs);
    }
  }

  var _prevOOD = window.openOrderDetail;
  window.openOrderDetail = function(id){
    if(typeof _prevOOD === 'function') _prevOOD.apply(this, arguments);
    var run = function(){ try{ enhance(id); }catch(e){ console.warn('oc full detail failed', e); } };
    setTimeout(run, 0);
    setTimeout(run, 180);
  };
  window.__ocEnhanceDetail = enhance;
})();


/* ============================================================================
   ORDERS TABLE v4
     1. Salesperson column
     2. Amount column now shows the Billing Amount (products total + 18% GST)
     3. New "Employee" dropdown filter next to the Order Status filter
     4. Sequential Order IDs - ORD0636, ORD0637, ORD0638 ... including a
        one-time renumbering of every previously created order (dispatch
        records that point at an order are remapped too).
   ========================================================================== */
(function(){
  'use strict';

  var START = 636;
  var MAPKEY = 'oc_orderIdMap';

  function pad(n){ return 'ORD' + String(n).padStart(4, '0'); }
  function seqOf(id){ var m = /^ORD0*(\d+)$/.exec(String(id == null ? '' : id)); return m ? parseInt(m[1], 10) : null; }
  function loadMap(){ try{ return JSON.parse(localStorage.getItem(MAPKEY) || '{}') || {}; }catch(e){ return {}; } }
  function saveMap(m){ try{ localStorage.setItem(MAPKEY, JSON.stringify(m)); }catch(e){} }

  var writing = false;

  function renumber(arr){
    if(!Array.isArray(arr)) return false;
    var legacy = arr.filter(function(o){ return o && seqOf(o.id) === null; });
    if(!legacy.length) return false;

    var used = {}, mx = START - 1;
    arr.forEach(function(o){
      var n = seqOf(o && o.id);
      if(n !== null){ used[n] = 1; if(n > mx) mx = n; }
    });
    var next = Math.max(START, mx + 1);
    function alloc(){ while(used[next]) next++; used[next] = 1; return next; }

    var pos = {};
    arr.forEach(function(o, i){ if(o) pos[o.id] = i; });
    legacy.sort(function(a, b){
      var d = String(a.date || '').localeCompare(String(b.date || ''));
      return d || ((pos[a.id] || 0) - (pos[b.id] || 0));
    });

    var map = loadMap(), remap = {};
    legacy.forEach(function(o){
      var old = String(o.id == null ? '' : o.id);
      var nid = map[old];
      var taken = nid ? arr.some(function(x){ return x !== o && x && x.id === nid; }) : true;
      if(!nid || taken || seqOf(nid) === null) nid = pad(alloc());
      else used[seqOf(nid)] = 1;
      map[old] = nid; remap[old] = nid; o.id = nid;
    });
    saveMap(map);

    try{
      var dis = DB.dispatch() || [], touched = false;
      dis.forEach(function(d){ if(d && remap[d.orderId]){ d.orderId = remap[d.orderId]; touched = true; } });
      if(touched){ writing = true; store.set('dispatch', dis); writing = false; }
    }catch(e){}
    return true;
  }

  var _save = DB.save;
  DB.save = function(k, v){
    if(k === 'orders' && Array.isArray(v) && !writing){
      writing = true;
      try{ renumber(v); }catch(e){ console.warn('order id renumber failed', e); }
      writing = false;
    }
    return _save.call(DB, k, v);
  };

  function migrate(){
    try{
      var arr = DB.orders() || [];
      if(renumber(arr)){
        writing = true; store.set('orders', arr); writing = false;
        if(state && state.view === 'orders' && typeof renderOrders === 'function') renderOrders();
      }
    }catch(e){ console.warn('order id migration failed', e); }
  }
  window.ocMigrateOrderIds = migrate;
  window.ocNextOrderId = function(){
    var arr = DB.orders() || [], mx = START - 1;
    arr.forEach(function(o){ var n = seqOf(o && o.id); if(n !== null && n > mx) mx = n; });
    return pad(Math.max(START, mx + 1));
  };

  setTimeout(migrate, 1200);
  setTimeout(migrate, 4000);
  setTimeout(migrate, 9000);

  /* ---------- Orders list: Salesperson column, Billing Amount, Employee filter ---------- */
  function billOf(o){ return Math.round((Number(o && o.amount) || 0) * 1.18); }
  function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  window.renderOrders = function(){
    var all = DB.orders();
    var mine = scope(all, 'orders');
    var seen = {}, emps = [];
    mine.forEach(function(o){
      var s = (o && o.salesperson) ? String(o.salesperson).trim() : '';
      if(s && !seen[s.toLowerCase()]){ seen[s.toLowerCase()] = 1; emps.push(s); }
    });
    emps.sort(function(a, b){ return a.localeCompare(b); });

    var stats = ['Confirmed','In Production','Ready','Dispatched','Delivered','Cancelled']
      .map(function(s){ return '<option>' + s + '</option>'; }).join('');
    var empOpts = emps.map(function(s){ return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('');

    content.innerHTML =
      '<div class="card"><div class="card-head">'
      + '<h3>Orders <span class="chip c-neutral" style="margin-left:4px">' + all.length + '</span></h3>'
      + '<div class="tools">'
      +   '<select class="field" id="f-ostat" onchange="paintTable(&quot;ord-body&quot;)"><option value="">All Status</option>' + stats + '</select>'
      +   '<select class="field" id="f-oemp" onchange="paintTable(&quot;ord-body&quot;)"><option value="">All Employees</option>' + empOpts + '</select>'

/* ============================================================================
   ORDER ID DEDUPE (v4.1)
   The Sheets backend upserts by id, so renaming an order id leaves the old
   row behind. Whenever an order arrives with a retired id AND an identical
   order with a sequential ORDnnnn id also exists, the retired copy is
   ignored everywhere in the app (and pruned from local storage after a pull).
   ========================================================================== */
(function(){
  'use strict';
  function isSeq(id){ return /^ORD0*\d+$/.test(String(id == null ? '' : id)); }
  function sig(o){
    return [o.customer, o.custId, o.date, o.amount, o.product, o.qty, o.status, o.payment, o.expDispatch].join('|');
  }
  function dedupe(arr){
    if(!Array.isArray(arr) || arr.length < 2) return arr;
    var groups = {}, i;
    for(i = 0; i < arr.length; i++){
      var o = arr[i];
      if(!o) continue;
      var s = sig(o);
      (groups[s] = groups[s] || []).push(o);
    }
    var drop = [];
    Object.keys(groups).forEach(function(s){
      var g = groups[s];
      if(g.length < 2) return;
      var hasSeq = g.some(function(o){ return isSeq(o.id); });
      if(!hasSeq) return;
      g.forEach(function(o){ if(!isSeq(o.id)) drop.push(o); });
    });
    if(!drop.length) return arr;
    return arr.filter(function(o){ return drop.indexOf(o) < 0; });
  }
  window.ocDedupeOrders = dedupe;

  var _orders = DB.orders;
  DB.orders = function(){
    try{ return dedupe(_orders.call(DB)); }catch(e){ return _orders.call(DB); }
  };

  function prune(){
    try{
      var raw = store.get('orders', []);
      var out = dedupe(raw);
      if(out.length !== raw.length){
        try{ localStorage.setItem('orders', JSON.stringify(out)); }catch(e){}
      }
    }catch(e){}
  }

  var _pull = CLOUD.pull;
  CLOUD.pull = function(){
    var self = this;
    var before = '';
    try{ before = localStorage.getItem('orders') || ''; }catch(e){}
    var p = _pull.apply(self, arguments);
    return Promise.resolve(p).then(function(r){
      prune();
      try{ if(typeof window.ocMigrateOrderIds === 'function') window.ocMigrateOrderIds(); }catch(e){}
      /* v10: orders sach me badle hon tabhi dobara paint karo. Pehle har sync par
         (har 25 sec) poori Orders table bina wajah dobara banti thi. */
      try{
        var now = ''; try{ now = localStorage.getItem('orders') || ''; }catch(e2){}
        if(now !== before && state && state.view === 'orders' && typeof renderOrders === 'function') renderOrders();
      }catch(e){}
      return r;
    });
  };

  setTimeout(prune, 800);
  setTimeout(prune, 3000);
  setTimeout(prune, 8000);
})();


/* ============================================================================
   ORDER ID - RETIRED LIST (v4.2)
   The Sheets backend upserts by id and never removes a row, so the ids that
   were replaced during the ORD0636 renumbering keep coming back on every
   pull. They are listed here once and ignored everywhere in the app.
   Canonical live ids are ORD0636 - ORD0646 and new orders continue from there.
   ========================================================================== */
(function(){
  'use strict';

  var RETIRED = {};
  ['ORD-IILH86','ORD-4PA560','ORD-0QPT78','ORD-7JPU94','ORD-IXST57','ORD-N7VK29',
   'ORD-QR6J81','ORD-NIDX12','ORD-42U265','ORD-XSNR44','ORD-261774'].forEach(function(id){ RETIRED[id] = 1; });

  var FIRST = 636;
  function pad(n){ return 'ORD' + String(n).padStart(4, '0'); }
  function seqOf(id){ var m = /^ORD0*(\d+)$/.exec(String(id == null ? '' : id)); return m ? parseInt(m[1], 10) : null; }
  function retired(id){ return !!RETIRED[String(id == null ? '' : id)]; }
  function live(o){ return !!o && !retired(o.id); }

  window.ocRetiredOrderId = retired;

  DB.orders = function(){
    var a = store.get('orders', []);
    return Array.isArray(a) ? a.filter(live) : [];
  };

  function prune(){
    try{
      var a = store.get('orders', []);
      if(!Array.isArray(a)) return;
      var out = a.filter(live);
      if(out.length !== a.length){
        try{ localStorage.setItem('orders', JSON.stringify(out)); }catch(e){}
        try{ localStorage.removeItem('oc_orderIdMap'); }catch(e){}
        try{ if(state && state.view === 'orders' && typeof renderOrders === 'function') renderOrders(); }catch(e){}
      }
    }catch(e){}
  }
  window.ocPruneRetiredOrders = prune;

  /* every save of the orders collection is cleaned and numbered here first */
  function fix(arr){
    var out = arr.filter(live);
    var legacy = out.filter(function(o){ return seqOf(o.id) === null; });
    if(legacy.length){
      var used = {}, mx = FIRST - 1;
      out.forEach(function(o){ var n = seqOf(o.id); if(n !== null){ used[n] = 1; if(n > mx) mx = n; } });
      var n = Math.max(FIRST, mx + 1);
      legacy.sort(function(a, b){ return String(a.date || '').localeCompare(String(b.date || '')); });
      legacy.forEach(function(o){
        while(used[n] || retired(pad(n))) n++;
        used[n] = 1;
        o.id = pad(n);
      });
    }
    return out;
  }

  var _save = DB.save;
  DB.save = function(k, v){
    if(k === 'orders' && Array.isArray(v)){
      try{ v = fix(v); }catch(e){ console.warn('order id fix failed', e); }
    }
    return _save.call(DB, k, v);
  };

  window.ocNextOrderId = function(){
    var out = DB.orders(), mx = FIRST - 1;
    out.forEach(function(o){ var x = seqOf(o.id); if(x !== null && x > mx) mx = x; });
    var n = Math.max(FIRST, mx + 1);
    while(retired(pad(n))) n++;
    return pad(n);
  };

  var _pull = CLOUD.pull;
  CLOUD.pull = function(){
    var p = _pull.apply(this, arguments);
    return Promise.resolve(p).then(function(r){ prune(); return r; }, function(e){ prune(); throw e; });
  };

  [300, 1500, 3500, 6000, 10000, 15000].forEach(function(ms){ setTimeout(prune, ms); });
})();


/* ============================================================================
   OAKCRAFT v5  -  SALESPERSON NAME SYNC + ORDER FEED TIMESTAMP + SHEET DEDUPE
   1) Salesperson names are normalised against the Users master in every
      collection (Enquiries / Quotations / Orders / Dispatch) so the same
      person can never appear with two different spellings.
   2) Every order stores the exact timestamp it was fed (createdAt). It is
      shown as a "Fed On" column in the Orders list and inside order detail.
   3) A collection is POSTed to the Google Sheet only when its contents have
      actually changed, so the same order never travels to the sheet twice.
   ========================================================================== */
(function(){
'use strict';

var K_STAMP = 'oc_orderStamps', K_SYNC = 'oc_orderSync', K_HASH = 'oc_syncHash';

function J(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function P(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function T(v){ return v == null ? '' : String(v); }
function esc(v){ return T(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hsh(s){ var h = 5381, i; for(i = 0; i < s.length; i++){ h = (((h << 5) + h) + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36) + '.' + s.length; }

function fmtTS(iso, short){
  if(!iso) return '';

  if(isNaN(d.getTime())) return '';

  var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12; if(h12 === 0) h12 = 12;
  var day = p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/';
  if(short) return day + String(d.getFullYear()).slice(-2) + '  ' + h12 + ':' + p2(d.getMinutes()) + ' ' + ap;
  return day + d.getFullYear() + ', ' + h12 + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) + ' ' + ap;

window.ocFmtTS = fmtTS;

/* ------------------------------------------------------------------
   1. CANONICAL SALESPERSON NAMES
   ------------------------------------------------------------------ */
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev = [], cur = [];
  if(!m) return n; if(!n) return m;
  for(j = 0; j <= n; j++) prev[j] = j;
  for(i = 1; i <= m; i++){
    cur[0] = i;
    for(j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
    }
    prev = cur.slice();
  }

function letters(x){ return T(x).toUpperCase().replace(/[^A-Z]/g, ''); }
function masterNames(){
  var out = [], seen = {};
  (J('users', []) || []).forEach(function(u){
    var n = (u && u.name) ? T(u.name).trim().replace(/\s+/g, ' ').toUpperCase() : '';
    if(n && !seen[n]){ seen[n] = 1; out.push(n); }

window.ocSalesMaster = masterNames;

window.ocCanonSalesperson = function(v){
  var raw = T(v).trim().replace(/\s+/g, ' ');
  if(!raw) return raw;
  var U = raw.toUpperCase(), list = masterNames(), i, best = null, bd = 99;
  for(i = 0; i < list.length; i++) if(list[i] === U) return list[i];
  for(i = 0; i < list.length; i++) if(letters(list[i]) === letters(U)) return list[i];
  for(i = 0; i < list.length; i++){
    var d = lev(letters(list[i]), letters(U));
    var fa = list[i].split(' ')[0], fb = U.split(' ')[0];
    var ok = (fa === fb && d <= 4) || (d <= 2);

var SP_FIELDS = ['salesperson', 'salesPerson', 'sales'];

/* ------------------------------------------------------------------
   2. ORDER FEED TIMESTAMP
   ------------------------------------------------------------------ */
function stampMap(){

  try{
    (store.get('orders', []) || []).forEach(function(o){
      if(o && o.id) m[o.id] = o.createdAt || 'legacy';
    });
  }catch(e){}
  P(K_STAMP, m);
  return m;

function stampOrders(arr){
  if(!Array.isArray(arr)) return arr;

  arr.forEach(function(o){

    if(m[o.id] === undefined){
      var t = new Date().toISOString();
      m[o.id] = t; o.createdAt = t; ch = true;
    }else if(m[o.id] !== 'legacy'){

/* ------------------------------------------------------------------
   3. SHEET PUSH DEDUPE  (same payload is never sent twice)
   ------------------------------------------------------------------ */
var _fetch = window.fetch;
window.fetch = function(url, opt){

          return Promise.resolve(new Response('{"ok":true,"skipped":true}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
        }

        opt2.body = body;
        return _fetch.call(window, url, opt2).then(function(res){

/* ============================================================================
   OAKCRAFT v6  -  ENQUIRY "SALESPERSONS" FILTER + FORM DROPDOWN SPELLING FIX
   Problem 1: the Enquiries filter dropdown was still printing the old demo
              seed list (Rahul Verma / Priya Nair / Amit Shah / Sneha Rao /

   Problem 2: the Form Builder's Salesperson dropdown had "AMIRA SHEIKH"
              saved as an option, which is why wrong spellings kept coming
              back into new enquiries.
   Both now resolve to one canonical list taken from the Users master.
   ========================================================================== */
(function(){
'use strict';
function T(v){ return v == null ? '' : String(v); }
function esc(v){ return T(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function canon(v){
  return (typeof window.ocCanonSalesperson === 'function')
    ? window.ocCanonSalesperson(v)
    : T(v).trim().replace(/\s+/g, ' ').toUpperCase();
}

/* the one true salesperson list: Form Builder options + names actually used */
window.ocSalesList = function(){
  var out = [], seen = {};
  function add(v){ var c = canon(v); if(c && !seen[c]){ seen[c] = 1; out.push(c); } }
  try{
    var fl = getForm('enquiry') || [];
    var f = fl.filter(function(x){ return x && /^salesperson$/i.test(T(x.label)); })[0];
    if(f && Array.isArray(f.options)) f.options.forEach(add);
  }catch(e){}
  try{ (DB.enquiries() || []).forEach(function(e){ if(e && e.salesperson) add(e.salesperson); }); }catch(e){}
  try{ (DB.orders() || []).forEach(function(o){ if(o && o.salesperson) add(o.salesperson); }); }catch(e){}
  out.sort(function(a, b){ return a.localeCompare(b); });
  return out;
};
window.ocSalesOptionsHTML = function(){

/* normalise the Salesperson dropdown options stored in the Form Builder */

    if(!Array.isArray(fields)) return;
    var changed = false;
    fields.forEach(function(f){
      if(!f || !Array.isArray(f.options)) return;
      if(!/^salesperson$/i.test(T(f.label))) return;

      f.options.forEach(function(o){ var c = canon(o); if(c && !seen[c]){ seen[c] = 1; out.push(c); } });
      if(out.join('|') !== f.options.join('|')){ f.options = out; changed = true; }
    });
    if(changed){ did.push(which); try{ saveForm(which, fields); }catch(e){} }
